/fred/etf_flows OK; predictions PARTIAL (one Kalshi 429), onchain PARTIAL (GitHub rate-limited, cache served)). Spot is Coinbase <code>/v2/prices/<i>/spot<\/code> at ~9:20 AM ET; 24h from Coinbase Exchange <code>/products/<\/i>/stats<\/code>; 7d/30d from Coinbase daily candles (today&#x27;s partial bar vs 7/30 bars back). ETF flows from Farside (Mon Oct 5 session) via SatoshiNakamoto.TV, BCI and FinanceFeeds.<\/p>","subs":[{"h":"(a) Market snapshot (~9:20 AM ET)","body":"<div class=\"tw\"><table><thead><tr><th>Coin<\/th><th>Spot (Coinbase)<\/th><th>7d<\/th><th>30d<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>BTC (holding)<\/td><td>$86,080<\/td><td>+2.9%<\/td><td>+7.1%<\/td><td>Oct 5 UTC close <b>$85,749<\/b>, 1.9% under the $87,397 trigger; third rejection near $87K since Sep 23 (CoinDesk)<\/td><\/tr><tr><td>ETH<\/td><td>$2,712<\/td><td>+1.4%<\/td><td>+7.9%<\/td><td>Oct 5 close $2,709.60, 3.6% under $2,807.10<\/td><\/tr><tr><td>XRP (holding)<\/td><td>$1.508<\/td><td>+1.2%<\/td><td>+5.9%<\/td><td>Oct 5 close $1.5077, 10.0% under $1.6581<\/td><\/tr><tr><td>SOL<\/td><td>$120.32<\/td><td>+1.0%<\/td><td>+13.0%<\/td><td><\/td><\/tr><tr><td>ZEC<\/td><td>$1,374<\/td><td>−3.3%<\/td><td>+11.6%<\/td><td>+2.3% on the day; NU7 testnet live<\/td><\/tr><tr><td>NEAR<\/td><td>$5.15<\/td><td>+5.6%<\/td><td><b>+112%<\/b><\/td><td>Chase gate; TOKEN2049 Oct 7–8<\/td><\/tr><tr><td>VVV (Venice)<\/td><td>$28.46<\/td><td>+5.5%<\/td><td><b>+68%<\/b><\/td><td>Chase gate; funding now 86% APR (7d 15%)<\/td><\/tr><tr><td>ADA<\/td><td>$0.2754<\/td><td>+12.7%<\/td><td>+23.4%<\/td><td>Golden cross + OI spike (see below)<\/td><\/tr><tr><td>TAO<\/td><td>$302.16<\/td><td>+0.5%<\/td><td>+13.7%<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><p><b>Leverage (signals.md):<\/b> BTC/XRP/ETH/ZEC/NEAR/VVV/TAO/SOL <b>COOL<\/b>. <b>ARX HOT.<\/b> RENDER and XMR <b>WARM<\/b> (OI +27% 1d each); FET, VIRTUAL, PHA, AKT, IO WARM. Stablecoins $312.66B, 7d +0.45% / 30d +1.21% (flat to slowly growing; USDC −0.78% 7d, RLUSD −0.69% 7d). BTC DVOL 36.5 (±1.9% implied daily); weekly 9-Oct 1σ ±2.7%. Polymarket BTC &quot;↑ $87.5K in October&quot; <b>81.5% (−5.0 pts 1d)<\/b>; &quot;↑ $90K in 2026&quot; 78.5%.<\/p>"},{"h":"(b) Items that matter","body":"<ul><li><b>BTC rejected at ~$87K for the third time; ETF flows turned negative Monday (short).<\/b> BTC fell back to ~$85.6K overnight after failing just above $87K Monday, the third cap since Sep 23; analysts describe a narrowing triangle (<a href=\"https://www.coindesk.com/markets/2026/10/06/bitcoin-keeps-getting-rejected-at-usd87-000-as-stocks-hover-near-records\" target=\"_blank\" rel=\"noopener\">CoinDesk, Oct 6<\/a>). Spot BTC ETFs <b>−$89.8M<\/b> on Oct 5 (IBIT +$69.9M; ARKB −$85.2M; FBTC −$74.5M), ETH ETFs a 5th straight outflow (−$18.9M; −$174M over five sessions), SOL −$9.2M (<a href=\"https://satoshinakamoto.tv/article/farside-mon05-btc-90-eth-19-outflow-complete\" target=\"_blank\" rel=\"noopener\">SatoshiNakamoto.TV/Farside<\/a> · <a href=\"https://financefeeds.com/crypto-etfs-lose-117-9m-on-october-5-as-bitcoin-ether-and-solana-all-record-outflows/\" target=\"_blank\" rel=\"noopener\">FinanceFeeds<\/a>). Leverage COOL, so no squeeze either way. New test today: buying a tight range before it breaks has <b>no ETF-era edge<\/b> (n=26, 27% win, −1.7%). <i>Horizon: short. Hype: low.<\/i><\/li><li><b>Bond selloff is the macro headwind (short/mid).<\/b> US 10-yr hit ~5.31% Monday, highest since 2002, easing to ~5.28% Tuesday; 30-yr ~5.64% (<a href=\"https://www.vantagemarkets.com/market-news/us-treasury-yields-highest-since-2002-october-6-2026/\" target=\"_blank\" rel=\"noopener\">Vantage, Oct 6<\/a> · <a href=\"https://www.lse.co.uk/news/global-markets-world-shares-advance-as-oil-falls-bond-yields-retreat-x1ca12io3gtyctj.html\" target=\"_blank\" rel=\"noopener\">LSE/Reuters<\/a>). Stocks are at records while BTC stalls. Polymarket Oct FOMC hold 81.5% / hike 17.5% (+1 pt); Kalshi maintain 83% / hike 18%. <b>FOMC minutes Wed Oct 7.<\/b> <i>Horizon: short/mid.<\/i><\/li><li><b>XRP: three catalysts this week, price flat (mid).<\/b> Evernorth&#x27;s merger with Armada II is expected to close Oct 7 with Nasdaq trading as <b>XRPN from Oct 8<\/b> (~473M XRP treasury, worth ~37% less than at signing) (<a href=\"https://beincrypto.com/xrp-bullish-signals-october-2026/\" target=\"_blank\" rel=\"noopener\">BeInCrypto, Oct 6<\/a>). On-chain feed: PermissionDelegationV1_1 <b>29/35 (margin 1)<\/b>, earliest Oct 8 5:25 PM ET; BatchV1_1 30/35 and fixBatchV1_2 35/35, Oct 9 ~10:12–10:46 AM ET. At XRP Seoul, Ripple laid out Confidential Transfers (ZK-hidden amounts with auditor access) and AI-agent wallets, and said it will move client settlement onto XRPL in <b>2027<\/b> (<a href=\"https://coinfractal.com/ripple-xrp-ledger-privacy-ai-agent-upgrades-seoul/\" target=\"_blank\" rel=\"noopener\">CoinFractal<\/a> · <a href=\"https://www.ad-hoc-news.de/boerse/news/unternehmensnachrichten/ripple-maps-out-2027-settlement-shift-as-xrp-ledger-lines-up-four-protocol-votes/70240062\" target=\"_blank\" rel=\"noopener\">ad-hoc-news<\/a>). XRP ETFs: 12th straight weekly inflow, but only +$4.74M. ⚠️ Invezz is openly pitching &quot;buy XRP ahead of Oct 8–10&quot;; our test of that setup failed (29% win, n=83). <i>Horizon: mid (events), long (2027 settlement). Hype flag on the run-up pitch.<\/i><\/li><li><b>CFTC proposed its own crypto market rules (long).<\/b> Regulation CTX / CAM advance notice published Oct 5: a new &quot;crypto asset market&quot; exchange category for <b>leveraged/margined<\/b> retail crypto; ordinary spot trading stays outside federal registration without Congress; binding rule not expected before late 2027 (<a href=\"https://www.coindesk.com/policy/2026/10/05/u-s-cftc-joins-sec-in-proposing-crypto-regulations-though-spot-market-gap-lingers\" target=\"_blank\" rel=\"noopener\">CoinDesk, Oct 5<\/a> · <a href=\"https://thehill.com/policy/technology/6129756-cftc-proposes-crypto-market-rules/\" target=\"_blank\" rel=\"noopener\">The Hill<\/a> · <a href=\"https://www.troutman.com/insights/in-the-wake-of-clarity-acts-failure-agencies-move-forward-without-congressional-action-or-certainty/\" target=\"_blank\" rel=\"noopener\">Troutman<\/a>). CLARITY odds unchanged: Polymarket signed-in-2026 <b>4.9%<\/b>, Kalshi before 2027 5.9%. <i>Horizon: long. Hype: low.<\/i><\/li><li><b>NEAR: real product activity, but a leveraged chart (mid).<\/b> NEAR Intents recovered the full $3.8M exploit on Oct 2; Intents did &gt;$4.5B DEX volume in 30 days (DefiLlama). But CoinGlass futures volume is ~5.6x spot and OI ~$1.59B, more than 6x NEAR&#x27;s DeFi TVL, into TOKEN2049 (<a href=\"https://www.cryptotimes.io/2026/10/06/near-price-jumps-128-in-a-month-as-ai-intents-and-hack-recovery-align/\" target=\"_blank\" rel=\"noopener\">CryptoTimes, Oct 6<\/a>). NEAR DEX volume −26% w/w (DefiLlama). <i>Horizon: mid. Leverage/hype flag.<\/i><\/li><li><b>Zcash NU7 testnet running (mid).<\/b> Testnet active at height 4,465,026; mainnet height decision Oct 20, target Nov 5 (<a href=\"https://zakura.com/nu7/\" target=\"_blank\" rel=\"noopener\">Zakura dashboard<\/a> · <a href=\"https://cointelegraph.com/news/zcash-nu7-testnet-activation-november-mainnet\" target=\"_blank\" rel=\"noopener\">Cointelegraph<\/a>). ZEC −3.3% for the week. <i>Horizon: mid.<\/i><\/li><\/ul>"},{"h":"(c) Filtered out","body":"<ul><li><b>ADA +11% (Oct 5):<\/b> RealFi mainnet / Leios hopes and a golden cross (<a href=\"https://www.coindesk.com/markets/2026/10/05/cardano-s-ada-leads-gains-in-narrow-range-bound-market\" target=\"_blank\" rel=\"noopener\">CoinDesk<\/a>), but OKX ADA OI jumped +31% in a day ($36.6M → $48.1M) on 6.5x futures volume while Cardano DEX volume fell (<a href=\"https://cryptonews.com/news/cardano-news-dex-volume-ada-rally/\" target=\"_blank\" rel=\"noopener\">Cryptonews<\/a>). Positioning, not demand. ADA&#x27;s own breakout record is negative.<\/li><li><b>VVV:<\/b> funding spiked to 86% APR now; ~+68%/30d. Chase.<\/li><li><b>RENDER / XMR:<\/b> OI +27% in a day each (WARM). <b>ARX HOT.<\/b><\/li><li><b>&quot;Buy XRP before the upgrades&quot; (Invezz):<\/b> already-tested losing setup.<\/li><\/ul>"},{"h":"(d) Idea pipeline","body":"<p><b>PASS logged for Oct 6<\/b> (ledger id 2026-10-06-01), the 6th straight pass day. No watch triggered; BTC is +1.9% away, ETH +3.6%, XRP +10.0%. New research file: <code>ideas/research/compression_study.py/.json<\/code> (tight-range and golden-cross tests; no edge). Structural: arb_scan found 2 tiny after-fee gaps (Satoshi-moves-BTC $192 at 1.3% ann, medium risk; Heisman $28 at 0.2%), neither qualifies. Funding-carry: 2 pairs, 8.91 days, funding $4.90, net if closed −$11.08 vs T-bill $3.91.<\/p><p>Sources: Coinbase spot/stats/daily candles (Oct 6 ~9:20 AM ET); OKX public API (ADA OI/funding, 9:21 AM ET); <code>data/signals.md<\/code>, <code>ideas/arb_scan.md<\/code>, <code>ideas/carry.md<\/code>, <code>ideas/scoreboard.md<\/code>; CoinDesk (×3), SatoshiNakamoto.TV, BCI, FinanceFeeds, Vantage, LSE/Reuters, BeInCrypto, Invezz, CoinFractal, ad-hoc-news, The Hill, Troutman, CryptoTimes, Zakura, Cointelegraph, Cryptonews (Oct 5–6).<\/p>"}]},{"h":"2026-10-05 (Mon), morning radar ~9:05 AM ET","intro":"<p><b>Data:<\/b> <code>python3 ideas/mark.py<\/code> finished clean at 9:04 AM ET (collect 34.8s; derivatives/defillama/predictions/options/fred/etf_flows OK; onchain PARTIAL, GitHub rate-limited so cache was served). Spot prices below are Coinbase public <code>/v2/prices/<i>/spot<\/code> at ~9:05 AM ET. 24h % is from Coinbase Exchange <code>/products/<\/i>/stats<\/code>; 7d/30d % is from Coinbase daily candles. ETF flows come from Farside via <code>data/signals.md<\/code> (last session Fri Oct 2) plus SoSoValue weekly totals via Cointelegraph/PANews (Oct 5).<\/p>","subs":[{"h":"(a) Market snapshot (~9:05 AM ET)","body":"<div class=\"tw\"><table><thead><tr><th>Coin<\/th><th>Spot (Coinbase)<\/th><th>24h<\/th><th>7d<\/th><th>30d<\/th><th>Notes<\/th><\/tr de 5-day is +$210.1M. ETH <b>−$138M<\/b>. <b>ZEC funds −$94M, their first weekly outflow on record.<\/b> XRP <b>+$4.74M<\/b> (vs $75.6M the week before; Fri −$3.28M), SOL +$2.4M. Fear &amp; Greed 70 (&quot;Greed&quot;, down from 74).<\/p>"},{"h":"(b) Items that matter","body":"<ul><li><b>BTC is pressing the $87.4K breakout, but there&#x27;s no trigger yet (short).<\/b> Oct 4 UTC close $86,507 (+2.1% d/d) is the closest to the $87,397 watch since it was armed. Leverage stays COOL (funding 7d 4.9% APR, OI 7d +0.1%), so it isn&#x27;t a leverage squeeze. Yahoo Finance ties the move to the soft jobs report pulling hike expectations down. A test run today found that <b>buying early (0–1.5% under the 20d high) has no ETF-era edge for BTC<\/b> (n=12, 33% win, +0.5% avg). Wait for the daily close. <i>Horizon: short. Hype: low.<\/i> <a href=\"https://finance.yahoo.com/personal-finance/investing/article/bitcoin-and-ethereum-prices-today-monday-october-5-2026-bitcoin-back-above-86000-after-higher-rate-expectations-fade-114459647.html\" target=\"_blank\" rel=\"noopener\">Yahoo Finance, Oct 5<\/a> · [research/near_breakout_study.json]<\/li><li><b>Rates: the soft jobs report cut October hike odds, but a December hike is still the base case (short/mid).<\/b> Sep NFP was +29K (unemployment 4.2%, wages +3.0% y/y) (<a href=\"https://www.cnbc.com/2026/10/02/fed-rate-hike-odds-decline-after-september-jobs-report.html\" target=\"_blank\" rel=\"noopener\">CNBC, Oct 2<\/a>; <a href=\"https://cepr.net/publications/september-2026-jobs-report/\" target=\"_blank\" rel=\"noopener\">CEPR<\/a>). Polymarket Oct hold is 82.5% / hike 16.5%; Kalshi maintain 82% / hike 18%. <b>Kalshi &quot;hike before 2027&quot; is 74%.<\/b> The 10-yr is at 5.24%. <b>FOMC minutes Wed Oct 7<\/b> are the next rate event (<a href=\"https://coinbeat.news/bitcoin-hits-86-160-as-traders-await-fed-minutes\" target=\"_blank\" rel=\"noopener\">CoinBeat<\/a>). <i>Horizon: short/mid.<\/i><\/li><li><b>Zcash NU7 is live on testnet two days early, while ZEC funds see their first outflow (mid).<\/b> Activation block 4,465,026 was mined Oct 4 18:21 UTC. The mainnet height decision is <b>Oct 20<\/b>, with a <b>Nov 5<\/b> target. It brings 25-second blocks, disables v4 transactions, and makes Sprout funds unspendable unless they&#x27;re moved first (<a href=\"https://cointelegraph.com/news/zcash-nu7-testnet-activation-november-mainnet\" target=\"_blank\" rel=\"noopener\">Cointelegraph, Oct 5<\/a>). This is real execution progress, but price is −10.5% for the week and ZEC funds lost ~$94M. The tape says sell-the-news. <i>Horizon: mid. Hype flag on any &quot;buy the upgrade&quot; pitch.<\/i><\/li><li><b>XRPL amendments, Oct 8–9 (mid).<\/b> On-chain feed: PermissionDelegationV1_1 is at <b>29/35 (margin 1)<\/b>, earliest <b>Oct 8, 5:25 PM ET<\/b>. fixBatchV1_2 is 35/35 and BatchV1_1 30/35, both <b>Oct 9 ~10:12–10:46 AM ET<\/b>. ⚠️ InteractiveCrypto (Oct 5) says PermissionDelegation is &quot;live&quot;, but that contradicts the validator feed and ad-hoc-news. Treat it as <b>unverified<\/b>. Also notable: Ripple&#x27;s Monica Long described XRP-as-collateral credit pilots targeting <b>2027<\/b> (<a href=\"https://coinpaper.com/36775/ripples-new-credit-business-could-give-xrp-a-new-source-of-demand\" target=\"_blank\" rel=\"noopener\">coinpaper, Oct 5<\/a>). That&#x27;s a long-horizon demand idea, not a near-term catalyst. XRP ETF weekly inflow slowed to +$4.74M (<a href=\"https://www.panews.io/articles/01a109ed-2266-75aa-b31c-7697c8ec7fca\" target=\"_blank\" rel=\"noopener\">PANews<\/a>). <i>Horizon: mid/long.<\/i><\/li><li><b>Nillion Blacklight L1 mainnet launched Oct 5 (privacy+AI, short).<\/b> Node staking needs a 70,000-NIL minimum, with 0.5%/yr inflation rewards (<a href=\"https://nillion.com/news/blacklight-node-migration-the-move-to-ethereum-l1/\" target=\"_blank\" rel=\"noopener\">Nillion, Sep 26<\/a>; <a href=\"https://www.tradingview.com/news/coinmarketcal:51f89647b094b:0-ethereum-blacklight-l1-mainnet-launches-with-nil-node-staking-and-inflation-rewards-05-oct-2026/\" target=\"_blank\" rel=\"noopener\">TradingView/CoinMarketCal<\/a>). The event happened as scheduled. NIL is <b>WARM<\/b> (OI +47% 1d, OI = 20% of mcap): leverage into a launch day. <i>Horizon: short. Hype/leverage flag.<\/i><\/li><li><b>CLARITY is still stalled as the Senate returns (long).<\/b> The Senate is back Oct 5 with fewer than 36 legislative days left. Lummis&#x27;s &quot;CLARITY 2.0&quot; substitute text exists, but nothing is scheduled. The agencies are moving instead: the SEC Regulation Crypto Assets comment period closes <b>Oct 20<\/b>, and the CFTC crypto rule is at OIRA (<a href=\"https://www.orrick.com/Insights/2026/10/The-CLARITY-Act-Stalls-in-the-Senate-Whats-Next-for-Digital-Asset-Regulation\" target=\"_blank\" rel=\"noopener\">Orrick<\/a>; <a href=\"https://unbiasedheadlines.com/article/clarity-act-stays-dead-in-the-senate-as-agencies-push-crypto-rules-forward-without-it\" target=\"_blank\" rel=\"noopener\">Unbiased Headlines<\/a>). Polymarket signed-in-2026 is <b>5.1%<\/b>; Kalshi before 2027 is 6.0% (+1 pt). <i>Horizon: long. Hype: low.<\/i><\/li><\/ul>"},{"h":"(c) Filtered out","body":"<ul><li><b>&quot;AI token rotation&quot; (FET/VIRTUAL/NEAR, FXStreet Oct 5):<\/b> FET and VIRTUAL are leverage WARM with OI rising fast, and NEAR is +130%/30d. That&#x27;s a narrative with leverage behind it. <a href=\"https://www.fxstreet.com/cryptocurrencies/news/ai-tokens-price-prediction-capital-rotation-fuels-fet-virtual-and-near-rallies-202610051017\" target=\"_blank\" rel=\"noopener\">FXStreet<\/a><\/li><li><b>VVV (+71%/30d):<\/b> now fails the chase gate.<\/li><li><b>QNT (+301%/30d), AKT (HOT):<\/b> chase / leverage.<\/li><li><b>&quot;CoinShares: 4th week of outflows, BTC down ~50% from ATH&quot; (nftaiverse, dated Oct 5):<\/b> its numbers don&#x27;t match today&#x27;s market (BTC is ~32% off its ATH, and Friday was NFP, not CPI). It looks like a recycled older report. <b>Unreliable, ignored.<\/b><\/li><li><b>&quot;PermissionDelegation is live&quot; (InteractiveCrypto):<\/b> contradicted by the amendment feed. Unverified.<\/li><li><b>Front-running the BTC breakout:<\/b> tested today, no ETF-era edge.<\/li><\/ul>"},{"h":"(d) Idea pipeline","body":"<p><b>PASS logged for Oct 5<\/b> (ledger id 2026-10-05-01), the 5th straight pass day. No armed watch triggered. BTC is the closest at <b>+1.0%<\/b>, then ETH +2.9% and XRP +9.1%. A trigger is not an automatic entry; re-vet with <code>add_idea.py<\/code> if one flips. New research file: <code>ideas/research/near_breakout_study.py/.json<\/code> (early entry vs confirmed breakout). Structural: arb_scan found 1 after-fee opportunity (Satoshi-moves-BTC, medium risk, $311, 2.1% ann). It doesn&#x27;t qualify for a paper open. Funding-carry: 2 pairs, 7.91 days, funding $4.30, net if closed −$11.71 vs T-bill $3.47 (−13.5% ann; entry fees still dominate).<\/p><p>Sources: Coinbase spot/stats/daily candles (Oct 5 ~9:05 AM ET); <code>data/signals.md<\/code>, <code>ideas/arb_scan.md<\/code>, <code>ideas/carry.md<\/code>, <code>ideas/scoreboard.md<\/code> from mark.py; Yahoo Finance, CoinBeat, Cointelegraph (×2), PANews, coinpaper, ad-hoc-news, InteractiveCrypto, Nillion, TradingView/CoinMarketCal, Orrick, Unbiased Headlines, CNBC, CEPR, FXStreet (Oct 2–5).<\/p>"}]},{"h":"2026-10-04 (Sun), morning radar ~9:10 AM ET","intro":"<p><b>Data:<\/b> <code>python3 ideas/mark.py<\/code> finished clean at 9:06 AM ET (collect 97.8s; derivatives PARTIAL — HL funding history BTC 429; defillama/predictions/options/fred/etf_flows OK; onchain PARTIAL — GitHub rate-limited, served cache). Spot prices below are Coinbase public <code>/v2/prices/<i>/spot<\/code> at ~9:07 AM ET; 24h % from Coinbase Exchange <code>/products/<\/i>/stats<\/code>; 7d/30d % from Coinbase daily candles (CoinGecko free tier 429 again). ETF flows from Farside via <code>data/signals.md<\/code> (last session Fri Oct 2 — markets closed Sunday).<\/p>","subs":[{"h":"(a) Market snapshot (~9:07 AM ET)","body":"<div class=\"tw\"><table><thead><tr><th>Coin<\/th><th>Spot (Coinbase)<\/th><th>24h<\/th><th>7d<\/th><th>30d<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>BTC (holding)<\/td><td>$85,131<\/td><td>+0.3%<\/td><td>+0.8%<\/td><td>+6.8%<\/td><td>Oct 3 UTC close $84,742; still −3.1% below $87,397 breakout<\/td><\/tr><tr><td>ETH<\/td><td>$2,695<\/td><td>+0.5%<\/td><td>+0.3%<\/td><td>+9.7%<\/td><td>Oct 3 close $2,687; −4.5% below $2,807 trigger<\/td><\/tr><tr><td>XRP (holding)<\/td><td>$1.499<\/td><td>+0.8%<\/td><td>−1.2%<\/td><td>+7.1%<\/td><td>Oct 3 close $1.486; −11.6% below $1.6581 trigger<\/td><\/tr><tr><td>SOL<\/td><td>$121.26<\/td><td>+1.5%<\/td><td>−0.6%<\/td><td>+18.9%<\/td><td><\/td><\/tr><tr><td>ZEC<\/td><td>$1,331<\/td><td>+2.1%<\/td><td>−16.1%<\/td><td>+30.0%<\/td><td>Cooling; NU7 testnet Tue Oct 6<\/td><\/tr><tr><td>NEAR<\/td><td>$4.88<\/td><td>+5.1%<\/td><td>−9.4%<\/td><td><b>+124%<\/b><\/td><td>Fails +60%/30d chase gate<\/td><\/tr><tr><td>VVV (Venice)<\/td><td>$27.88<\/td><td>~0%<\/td><td>−4.8%<\/td><td>+54.0%<\/td><td>Under 60% chase but still elevated post-emissions cut<\/td><\/tr><tr><td>QNT<\/td><td>$253.51<\/td><td>−0.5%<\/td><td>−11.4%<\/td><td><b>+298%<\/b><\/td><td>Leverage <b>WARM<\/b> (OI +102% 7d); hard chase<\/td><\/tr><\/tbody><\/table><\/div><p><b>Leverage (signals.md):<\/b> BTC/XRP/ETH/ZEC/NEAR/VVV all <b>COOL<\/b>; GRASS <b>HOT<\/b>; QNT/ARX/IO/XMR/FET <b>WARM<\/b>. Stablecoin supply $312.0B, 7d +0.61% (expanding). BTC DVOL 35.76 (±1.9% implied daily); ETH DVOL 49.41.<\/p><p><b>ETF flows (Farside, US$M; last session Fri Oct 2):<\/b> BTC Oct 2 <b>+$31.7<\/b>; 5 sessions Sep 28–Oct 2 <b>+$82.9<\/b>. ETH Oct 2 <b>−$17.3<\/b>; 5d <b>−$118<\/b>. SOL Oct 2 +$1.3; 5d +$0.8. No Saturday/Sunday print.<\/p>"},{"h":"(b) Items that matter","body":"<ul><li><b>Quiet weekend grind under the $87K wall (short).<\/b> BTC Oct 3 UTC close $84,742 (+0.3% vs Oct 2); Sunday morning ~$85.1K. Friday’s jobs-driven spike to ~$87.2K and rejection still define the range — Coinjuice/DefiLlama put Oct 2 high $87,085 and close $84,504. No armed breakout. Polymarket Oct Fed <b>no change 82.5%<\/b> (hike 25bps 16.5%, −1.0 pt 1d); Kalshi maintain <b>82%<\/b> / hike <b>18%<\/b>. 10-yr <b>5.24%<\/b> (FRED Oct 1). <i>Horizon: short. Hype: low.<\/i> [signals.md] · <a href=\"https://coinjuice.com/research-hub/what-happened-in-bitcoin-today-october-3-2026\" target=\"_blank\" rel=\"noopener\">Coinjuice, Oct 3<\/a><\/li><li><b>XRP ETFs still the only major group underwater ~$133M (mid).<\/b> 24/7 Wall St / SoSoValue (Oct 4): $1.79B lifetime inflows vs $1.66B AUM (−7%); needs ~$1.62 to break even on average cost. Week net ~+$5M after Oct 2 Bitwise −$3.28M. Confirms soft tape into Oct 8–9 amendments — not a fresh long from mid-range. <i>Horizon: mid. Not a short (spot-long-only lab).<\/i> <a href=\"https://247wallst.com/investing/cryptocurrency/2026/10/04/xrp-etfs-put-in-1-79-billion-but-hold-1-66-billion-why-are-they-the-only-major-crypto-etfs-underwater/\" target=\"_blank\" rel=\"noopener\">24/7 Wall St, Oct 4<\/a><\/li><li><b>XRPL amendments still on the Oct 8–9 timer (mid).<\/b> PermissionDelegationV1_1 <b>29/35<\/b> → earliest <b>Oct 8, 5:25 PM ET<\/b>; fixBatchV1_2 <b>34/35<\/b> → <b>Oct 9, 10:12 AM ET<\/b>; BatchV1_1 <b>30/35<\/b> → <b>Oct 9, 10:46 AM ET<\/b>. XRP ~11.6% below armed breakout; mid-range amendment-run-up base rate already rejected (29% win, −2.0% avg, n=83). <i>Horizon: mid. Not an entry today.<\/i> [signals.md on-chain] · <a href=\"https://coinpaper.com/36637/three-xrp-ledger-upgrades-could-go-live-within-48-hours\" target=\"_blank\" rel=\"noopener\">xrpldashboard / coinpaper<\/a><\/li><li><b>Zcash NU7 official testnet due Tue Oct 6 (mid).<\/b> Height 4,465,026; Zebra 7.0.0-rc.0; mainnet height decision Oct 20, target Nov 5. ZEC −16%/7d / +30%/30d — cooled under the 60% chase gate but still no tested “buy the testnet” base rate. <i>Horizon: mid. Hype flag if pitched as a sp 60%/30d chase gate<\/td><\/tr><tr><td>VVV (Venice)<\/td><td>$27.89 (CG)<\/td><td>−6.5%<\/td><td>−6.7%<\/td><td><b>+67%<\/b><\/td><td>Emissions cut live since Oct 1; price still soft<\/td><\/tr><tr><td>QNT<\/td><td>$254.85 (CG)<\/td><td>+3.3%<\/td><td><b>+143%<\/b><\/td><td><b>+288%<\/b><\/td><td>Leverage <b>HOT<\/b> (OI +955% 7d) — rejected<\/td><\/tr><\/tbody><\/table><\/div><p><b>Leverage (signals.md):<\/b> BTC/XRP/ETH/ZEC/NEAR/VVV all <b>COOL<\/b>; QNT <b>HOT<\/b>; GRASS <b>HOT<\/b>; WLD/ARX <b>WARM<\/b>. Stablecoin supply $311.9B, 7d +1.33% (expanding). BTC DVOL 34.87 (±1.8% implied daily); ETH DVOL 47.95.<\/p><p><b>ETF flows (Farside, US$M):<\/b> BTC Oct 2 <b>+$31.7<\/b>; 5 sessions Sep 28–Oct 2 <b>+$82.9<\/b> (provisional — IBIT Friday blank on some trackers). ETH Oct 2 <b>−$17.3<\/b>; 5d <b>−$118<\/b>. SOL Oct 2 +$1.3; 5d +$0.8. <a href=\"https://crypto.news/crypto-etf-flows-split-bitcoin-gains-ethereum-bleeds/\" target=\"_blank\" rel=\"noopener\">crypto.news, Oct 3<\/a><\/p>"},{"h":"(b) Items that matter","body":"<ul><li><b>Jobs digest still the macro anchor (short).<\/b> Sep NFP <b>+29K<\/b> vs ~90K expected; U-3 <b>4.2%<\/b> (from 4.1%); July/Aug revised down ~60K combined (July into negative). Labor-force participation 61.8%. Polymarket Oct Fed <b>no change 82.5%<\/b> (+1.0 pt 1d); Kalshi maintain <b>82%<\/b> / hike 25bps <b>19%<\/b>. 10-yr still <b>5.24%<\/b> (FRED Oct 1). BTC&#x27;s Friday spike to ~$87.2K and giveback already logged; Saturday morning sits back ~$84.8K. <i>Horizon: short.<\/i> <a href=\"https://www.npr.org/2026/10/02/nx-s1-5989140/jobs-labor-wages-federal-reserve\" target=\"_blank\" rel=\"noopener\">NPR / BLS, Oct 2<\/a> · signals.md prediction markets<\/li><li><b>Spot BTC ETF flow pace remains a trickle vs the Sep 21–25 $2.39B week (mid).<\/b> Provisional week +$82.9M with ETH still bleeding. Big-inflow-week long was already tested Sep 27 (25% target-first, n=16, FAIL) — a quiet week is not a fresh signal either. <i>Horizon: mid. Not a /mid).<\/b> SoSoValue: Oct 2 Bitwise XRP ETF −$3.28M; category AUM ~$1.66B vs ~$1.79B lifetime inflows. Incremental, confirms soft tape into the amendments. <i>Not a short (spot-long-only lab).<\/i> <a href=\"https://vcpcrypto.com/xrp-etf-investors-are-now-133m-under-water-on-their-bets/\" target=\"_blank\" rel=\"noopener\">VCP Crypto, Oct 3<\/a><\/li><\/ul>"},{"h":"(c) Filtered out","body":"<ul><li><b>QNT / GRASS:<\/b> leverage HOT and/or +60%/30d chase.<\/li><li><b>NEAR (+145%/30d), VVV (+67%/30d), NIL (+75%/30d):<\/b> chase gate; NEAR also OI −22% 7d (deleveraging into the pullback).<\/li><li><b>Buy XRP into Oct 8–9 amendments from here:<\/b> still mid-range / below support relative to the $1.6581 trigger; prior base rate 29% win, −2.0% avg (n=83).<\/li><li><b>&quot;Buy the soft NFP dip&quot; on BTC:<\/b> Friday already did the spike-and-fade; no breakout close; ETF-flow momentum family previously failed.<\/li><\/ul>"},{"h":"(d) Idea pipeline","body":"<p>PASS logged for Oct 3 (see ideas ledger). No armed watch triggered (BTC/XRP/ETH). Watches stay armed at $87,397 / $1.6581 / $2,807.10 — trigger ≠ auto-entry; re-vet with <code>add_idea.py<\/code> if any flips. Structural: arb_scan found 3 after-fee opportunities (median ~1.9% ann, mostly tiny/$sports); funding-carry 2 pairs still net negative vs T-bill after ~6 days (entry fees dominating).<\/p><p>Sources: Coinbase spot + CoinGecko markets (Oct 3 ~9:05 AM ET); <code>data/signals.md<\/code> / <code>ideas/arb_scan.md<\/code> / <code>ideas/carry.md<\/code> / <code>ideas/scoreboard.md<\/code> from mark.py; NPR/BLS, crypto.news, ZIP 259, Zcash forum, XRPSCAN/cryptoticker, VCP Crypto (all Oct 2–3).<\/p>"}]},{"h":"2026-10-02 (Fri), week-in-review catch-up ~5:00-5:30 PM ET","intro":"<p><b>Why this is late:<\/b> the scheduled 8:56 AM radar and the CLARITY watch both failed on the platform side (&quot;Activity task failed&quot;), and there were no radar scans Sep 28 - Oct 1. This entry was written by hand from public sources the same afternoon. CoinGecko was rate-limiting (HTTP 429), so prices below are from Coinbase and news recaps.<\/p>","subs":[{"h":"(a) Market snapshot (Sep 27 00:00 UTC to Fri Oct 2, 5:15 PM ET, Coinbase)","body":"<div class=\"tw\"><table><thead><tr><th>Coin<\/th><th>Sep 27 open<\/th><th>Oct 2, 5:15 PM ET<\/th><th>Change<\/th><\/tr><\/thead><tbody><tr><td>BTC<\/td><td>$84,417<\/td><td>$84,486<\/td><td>+0.1%<\/td><\/tr><tr><td>ETH<\/td><td>$2,695.5<\/td><td>$2,662.8<\/td><td>-1.2%<\/td><\/tr><tr><td>XRP<\/td><td>$1.5271<\/td><td>$1.4727<\/td><td>-3.6%<\/td><\/tr><\/tbody><\/table><\/div><p>BTC spiked to $87,249 on today&#x27;s jobs print (Coinbase daily high) and gave it back, closing nowhere near the $87,397 breakout trigger. Press recaps quote +2% weekly for BTC because they measure from the Wed/Thu lows. Spot BTC ETFs: +$51M over Sep 28 - Oct 1 after +$2.39B the week before; spot ETH ETFs -$101M (Farside). <a href=\"https://cryptopotato.com/bitcoin-rejected-at-87k-despite-soft-pce-and-jobs-data-as-qnt-night-explode-weekly-crypto-recap/\" target=\"_blank\" rel=\"noopener\">CryptoPotato weekly recap, Oct 2<\/a><\/p>"},{"h":"(b) Items that matter","body":"<ul><li><b>Jobs (Oct 2):<\/b> Sep payrolls +29K vs ~84-90K expected; unemployment 4.2%; July revised to -10K, August to +133K. Fed-hike odds fell (Kalshi Oct 28 hold ~82%). <a href=\"https://www.cnbc.com/2026/10/02/jobs-report-september-2026.html\" target=\"_blank\" rel=\"noopener\">CNBC<\/a><\/li><li><b>PCE / GDP (Sep 30):<\/b> Aug PCE +0.3% m/m, 3.4% y/y; core 3.0% y/y, both below forecasts. Q2 GDP third estimate +2.2% (from 1.5%). <a href=\"https://www.bea.gov/news/2026/personal-income-and-outlays-august-2026\" target=\"_blank\" rel=\"noopener\">BEA<\/a><\/li><li><b>CLARITY Act:<\/b> no change since the Sep 15 cloture failure (49-50); Tillis&#x27;s motion to reconsider is pending, no new vote scheduled, Senate state work period Oct 5 - Nov 6. Polymarket &quot;signed into law in 2026&quot; 4.8%. <a href=\"https://www.dlapiper.com/en-us/insights/publications/2026/09/senate-fails-to-advance-the-clarity-act\" target=\"_blank\" rel=\"noopener\">DLA Piper<\/a><\/li><li><b>XRPL amendments:<\/b> PermissionDelegationV1_1 29/35 validators (needs more than 28, margin of 1) projected Oct 8; fixBatchV1_2 34/35 and BatchV1_1 30/35 projected Oct 9. LendingProtocolV1_1 opened for voting Sep 30 but only 9/35. <a href=\"https://xrpldashboard.com/amendments\" target=\"_blank\" rel=\"noopener\">xrpldashboard<\/a><\/li><li><b>Zcash NU7:<\/b> official testnet activation scheduled Oct 6, mainnet target Nov 5; so far only on the staging testnet. <a href=\"https://zips.z.cash/zip-0259\" target=\"_blank\" rel=\"noopener\">ZIP 259<\/a><\/li><li><b>VVV:<\/b> emissions cut 2.5M to 2M/yr took effect Oct 1; price was -14.75% over 7 days by Oct 2. The pre-announced cut did not lift it. <a href=\"https://coinstats.app/ai/a/latest-news-for-venice-token\" target=\"_blank\" rel=\"noopener\">CoinStats<\/a><\/li><\/ul>"},{"h":"(c) Filtered out","body":"<ul><li>QNT (+160% week) and NIGHT (+105% week): chases; fail the +60%/30d gate.<\/li><\/ul>"},{"h":"(d) Idea pipeline","body":"<p>PASS logged for Oct 2 (id 2026-10-02-01). No armed watch triggered (BTC/XRP/ETH). Waiting for a daily UTC close above $87,397 / $1.6581 / $2,807.10.<\/p><p>Sources: Coinbase public API (Oct 2, ~5:15 PM ET); CNBC, NPR, BEA, DLA Piper, xrpldashboard, ZIP 259, CoinStats, CryptoPotato (all Oct 2 or Sep 30).<\/p>"}]},{"h":"2026-09-27 (Sun), scan run ~12:57–1:07 AM ET","intro":"<p><b>Data:<\/b> CoinGecko free API. Watchlist pulled <b>00:58:33 ET<\/b> (CoinGecko <code>last_updated<\/code> 00:56 ET). PHA pulled separately at 01:03 ET because its CoinGecko id is <code>pha<\/code>, not <code>phala-network<\/code>. Global data timestamp is 00:50 ET. Trending and the top-250 list were pulled ~00:59–01:00 ET. The ranks 251–300 page hit CoinGecko&#x27;s rate limit (HTTP 429) on every retry, so gainers cover the top 250 only. Raw JSON is in <code>/workspace/crypto-ai/radar-2026-09-27/<\/code>. Venice id verified: <code>venice-token<\/code> (VVV, rank #68).<\/p><p><b>Dashboard:<\/b> <code>/workspace/crypto-ai/radar-2026-09-27/dashboard.png<\/code>. The 7-day sparklines use CoinGecko&#x27;s <code>sparkline_in_7d<\/code> series from <code>/coins/markets<\/code>.<\/p>","subs":[{"h":"(a) Market snapshot","body":"<div class=\"tw\"><table><thead><tr><th><\/th><th>Price<\/th><th>24h<\/th><th>7d<\/th><th>Mcap / rank<\/th><\/tr><\/thead><tbody><tr><td><b>Total crypto mcap<\/b><\/td><td><b>$2.90T<\/b><\/td><td>−2.4%<\/td><td><\/td><td>BTC dominance <b>58.3%<\/b>, ETH 11.3%, 24h volume $57B<\/td><\/tr><tr><td><b>BTC<\/b> (holding)<\/td><td><b>$84,306<\/b><\/td><td>+0.4%<\/td><td>+5.1%<\/td><td>$1.69T, #1<\/td><\/tr><tr><td><b>XRP<\/b> (holding)<\/td><td><b>$1.51<\/b><\/td><td>−3.1%<\/td><td>+10.6%<\/td><td>$94.8B, #5<\/td><\/tr><tr><td>ETH<\/td><td>$2,691.77<\/td><td>+0.1%<\/td><td>+4.9%<\/td><td>#2<\/td><\/tr><tr><td>SOL<\/td><td>$120.17<\/td><td>−0.4%<\/td><td>+12.2%<\/td><td>#7<\/td><\/tr><tr><td>ZEC<\/td><td>$1,634.68<\/td><td>+6.3%<\/td><td>+12.9%<\/td><td>$27.7B, #9<\/td><\/tr><tr><td>XMR<\/td><td>$561.18<\/td><td>+0.6%<\/td><td>+6.5%<\/td><td>#13<\/td><\/tr><tr><td>NEAR<\/td><td>$5.07<\/td><td>+3.7%<\/td><td>+44.7%<\/td><td>$6.63B, #22<\/td><\/tr><tr><td>VVV (Venice)<\/td><td>$29.32<\/td><td>−3.2%<\/td><td>+14.4%<\/td><td>$1.41B, #68<\/td><\/tr><tr><td>ZAMA<\/td><td>$0.0885<\/td><td>−1.3%<\/td><td>+12.9%<\/td><td>#182<\/td><\/tr><tr><td>ROSE (Oasis)<\/td><td>$0.00874<\/td><td>+2.1%<\/td><td>+19.1%<\/td><td>#388<\/td><\/tr><tr><td>PHA (Phala)<\/td><td>$0.0721<\/td><td>−15.5%<\/td><td>+104.4%<\/td><td>#426<\/td><\/tr><tr><td>NIL (Nillion)<\/td><td>$0.0965<\/td><td>−15.9%<\/td><td>+97.9%<\/td><td>#503<\/td><\/tr><tr><td>ARX (Arcium)<\/td><td>$0.2249<\/td><td>−8.3%<\/td><td>+22.7%<\/td><td>#518<\/td><\/tr><tr><td>SCRT (Secret)<\/td><td>$0.00833<\/td><td>−0.5%<\/td><td>+3.1%<\/td><td>#1682<\/td><\/tr><\/tbody><\/table><\/div><p><b>Top-250 24h gainers (excluding stablecoins):<\/b> QNT +90.6% (7d +170%), Q (Quack AI) +36%, RUNE +20%, 2Z +18%, BTW +16%, DASH +13.5%, GRASS +12.9%, RAIN +12.9%, PYTH +12.4%. <b>Top 7d:<\/b> QNT +170%, BP (Backpack) +104%, BTW +74%, KMNO +68%, GRASS +62%, RUNE +51%, SEI +50%, NEAR +45%, SUI +43%.<\/p><p><b>CoinGecko trending:<\/b> QNT, EDEL, ZEC, PENGU, ENA, NEAR, PONS, TAO, SUI, RAY, XRP, BP, KAS, RHEA, BTC. Trending categories include &quot;Privacy Infrastructure&quot; and &quot;Chain Abstraction&quot;.<\/p><p><b>Macro backdrop:<\/b> the Fed hiked 25bp to 3.75–4.00% on Sep 16. The US 10Y yield hit 5.23% on Thu Sep 24, a 19-year high, and closed Friday at 5.17%. Markets price ~70% odds of another hike on Oct 28 (<a href=\"https://nordfx.com/market-news/forex-cryptocurrency-forecast-september-28-october-02-2026\" target=\"_blank\" rel=\"noopener\">NordFX weekly, Sep 26<\/a>; <a href=\"https://blog.e8markets.com/article/higher-fed-hike-odds-put-fresh-macro-pressure-on-bitcoin\" target=\"_blank\" rel=\"noopener\">E8 Markets, Sep 26<\/a>).<\/p>"},{"h":"(b) Items that clear the bar","body":"<ul><li><b>Spot BTC ETFs took in +$2.39B for Sep 21–25, and 2026 net flows turned positive.<\/b> This was the best week since Oct 2025. Daily inflows faded from $999M on Monday to $134M on Friday after hot PMI data and 5%+ yields. ETH ETFs added ~$690M, and SOL ETFs set a record daily inflow of $86.7M on Friday.<\/li><\/ul><p>   <i>Why it matters:<\/i> this is direct institutional demand for his BTC. The fading daily pace is the caveat. <i>Substantive<\/i> (fund-flow data). <a href=\"https://www.theblock.co/news/markets/2026-09-26-bitcoin-etfs-turn-positive-for-2026-with-2-4-billion-weekly-inflow-their-largest-since-october-416944\" target=\"_blank\" rel=\"noopener\">The Block, Sep 26<\/a> · <a href=\"https://u.today/bitcoin-etfs-record-239-billion-weekly-inflows-as-btc-holds-above-84000\" target=\"_blank\" rel=\"noopener\">U.Today, Sep 26<\/a> · <a href=\"https://247wallst.com/investing/cryptocurrency/2026/09/26/bitcoin-etf-inflows-reach-2-4-billion-this-week-but-daily-figures-decline-is-the-momentum-fading/\" target=\"_blank\" rel=\"noopener\">24/7 Wall St, Sep 26<\/a><\/p><ul><li><b>Bitwise NEAR ETF (ticker NRR): the SEC declared its registration effective on Sep 24, and Bitwise filed Form 8-A for NYSE Arca.<\/b> The fund plans to stake its NEAR holdings and charge a 0.75% fee. <b>No first trading date is set.<\/b> NEAR is +44.7% over 7 days.<\/li><\/ul><p>   <i>Why it matters:<\/i> a US spot ETF is close for a watchlist coin. <i>Substantive<\/i> (a regulatory milestone), but the price already reflects anticipation. <a href=\"https://finance.biggo.com/news/7af62fa4-92e2-45ca-9c8e-f442791b3569\" target=\"_blank\" rel=\"noopener\">BigGo, Sep 26<\/a> · <a href=\"https://www.coingabbar.com/en/bitwise-near-etf-nrr-nyse-arca-news-near-token-price-rally\" target=\"_blank\" rel=\"noopener\">CoinGabbar, Sep 26<\/a><\/p><ul><li><b>Zcash hit a record high of $1,697.45 on Sat Sep 26. Grayscale&#x27;s ZCSH ETF crossed $1B AUM on Sep 24 and has a 3-for-1 split pending. The NU7 upgrade is dated.<\/b><\/li><li>ZCSH: cumulative net inflows are only ~$306M, so most of the AUM growth is price. Split record date is Sep 28, effective before the Sep 30 open.<\/li><li>NU7: code complete Sep 30, testnet Oct 6, mainnet decision Oct 20, mainnet Nov 5. It brings 25-second blocks and keeps halvings.<\/li><li>Usage: ~63k shielded transactions in the week, the busiest since 2022.<\/li><\/ul><p>   <i>Why it matters:<\/i> this is the core coin of his privacy theme, with real on-chain usage and ETF demand. <i>Substantive<\/i>, but the move is parabolic. The long-run overhang is the EU AMLR ban on exchange-listed anonymity coins from Jul 10, 2027. <a href=\"https://www.tokenpost.com/news/investing/24492\" target=\"_blank\" rel=\"noopener\">TokenPost, Sep 26<\/a> · <a href=\"https://www.analyticsinsight.net/news/grayscales-zcash-etf-reaches-usd-1b-as-zec-price-gains-lift-assets\" target=\"_blank\" rel=\"noopener\">Analytics Insight<\/a> · <a href=\"https://forum.zcashcommunity.com/t/nu7-timeline/57655\" target=\"_blank\" rel=\"noopener\">Zcash Forum NU7 timeline, Sep 17<\/a> · <a href=\"https://www.coindesk.com/tech/2026/09/25/bitcoin-could-soon-get-zcash-style-shielded-privacy-without-changing-its-rules\" target=\"_blank\" rel=\"noopener\">CoinDesk, Sep 25<\/a><\/p><ul><li><b>XRP is +10.6% over 7 days (−3.1% over 24h), with ETF inflows still running.<\/b><\/li><li>ETFs: +$22.65M on Sep 25 (led by Bitwise and Franklin), ~$1.79B cumulative.<\/li><li>Upgrade delay: the XRPL Batch amendment slipped from Sep 29 to <b>Oct 9 at the earliest<\/b> (10:46 AM ET) after validator support briefly dropped below 80%. PermissionDelegation is now earliest Oct 8.<\/li><li>Caveat: the Sep 18 +7.7% jump came from a routine post-effective amendment to the already-trading Bitwise XRP ETF, not a new approval.<\/li><\/ul><p>   <i>Why it matters:<\/i> this is his largest holding. <i>Substantive<\/i> but incremental, and the ledger features are only delayed. <a href=\"https://bitinsider.io/articles/xrp-spot-etf-inflows-climb-to-2265-million-as-price-falls-46\" target=\"_blank\" rel=\"noopener\">BitInsider, Sep 26<\/a> · <a href=\"https://www.coindesk.com/tech/2026/09/26/xrp-ledger-s-batch-upgrade-slips-to-oct-9-after-validator-support-resets\" target=\"_blank\" rel=\"noopener\">CoinDesk, Sep 26<\/a> · <a href=\"https://finance.biggo.com/news/7af62fa4-92e2-45ca-9c8e-f442791b3569\" target=\"_blank\" rel=\"noopener\">BigGo, Sep 26<\/a><\/p><ul><li><b>Quant (QNT) is +90.6% over 24h after The Clearing House picked it for its On-Chain Money Initiative.<\/b> QNT will provide the orchestration layer for tokenized deposits over the RTP and CHIPS networks, with rollout targeted for H1 2027. A UK tokenized-sterling pilot (Barclays, HSBC, Lloyds and others) was also reported live.<\/li><\/ul><p>   <i>Why it matters:<\/i> this is a real deal with US bank infrastructure. <i>The partnership is substantive; the size of the move is partly a short squeeze.<\/i> QNT is not on his watchlist. <a href=\"https://www.theclearinghouse.org/payment-systems/Articles/2026/09/The-Clearing-House-Partners-with-Quant-to-Advance-the--On-Chain-Money-Initiative\" target=\"_blank\" rel=\"noopener\">The Clearing House press release, Sep 24<\/a> · <a href=\"https://azat.tv/en/quant-qnt-banking-tokenisation-rally-september-2026/\" target=\"_blank\" rel=\"noopener\">Azat TV, Sep 27<\/a><\/p><ul><li><b>Open USD (OUSD) stablecoin consortium update (Sep 25).<\/b> Coinbase, Mastercard, Shopify, Stripe and Visa will seed more than $1B in initial liquidity, and Zach Abrams becomes full-time CEO. The consortium has 140+ partners, including Google, BlackRock, BNY and Ripple, and launch is planned for later in 2026.<\/li><\/ul><p>   <i>Why it matters:<\/i> big tech, payments and banks are converging on stablecoin rails, but there is no investable token. <i>Substantive.<\/i> The Sep 25 details come from secondary coverage; the original announcement was Jun 30. <a href=\"https://phemex.com/news/article/open-standard-secures-1b-liquidity-from-coinbase-visa-stripe-for-ousd-stablecoin-launch-97813\" target=\"_blank\" rel=\"noopener\">Phemex<\/a> · <a href=\"https://coingape.com/block-of-fame/pulse/open-standard-ousd-gets-full-time-ceo-as-bridge-co-founder-zach-leaves-stripe/\" target=\"_blank\" rel=\"noopener\">Coingape<\/a> · <a href=\"https://joinopenstandard.com/blog/introducing-open-usd/\" target=\"_blank\" rel=\"noopener\">Open Standard, Jun 30<\/a><\/p><ul><li><b>Privacy x AI / confidential compute: the integrations are real, but the price moves are heavily leveraged.<\/b><\/li><li>Moves: PHA +104% over 7d but −15.5% over 24h; NIL +98% / −15.9%; ARX +23% / −8%; ROSE +19%; ZAMA +13%.<\/li><li>Integrations: NEAR AI&#x27;s confidential inference went live on Bittensor&#x27;s SayGm gateway (Sep 18). Venice runs encrypted inference on NEAR.<\/li><li>Leverage: PHA futures open interest (~$120M) exceeded its entire spot market cap during the spike.<\/li><\/ul><p>   <i>Why it matters:<\/i> this is exactly his theme, and it moved 10%+. <i>Speculative price action on top of integrations that are substantive but small.<\/i> <a href=\"https://taodaily.io/near-ai-joins-forces-with-bittensors-saygm-to-make-private-ai-easier-to-use/\" target=\"_blank\" rel=\"noopener\">TAO Daily, Sep 20<\/a> · <a href=\"https://www.cryptonewslive.org/article/pha-tripled-with-three-privacy-tokens-then-leverage-erased-a-third-of-it\" target=\"_blank\" rel=\"noopener\">CryptoNewsLive on PHA leverage, Sep 22<\/a> · <a href=\"https://www.tradingview.com/news/coinmarketcal:b6261e451094b:0-near-protocol-venice-launches-verifiably-encrypted-ai-inference-on-near-24-sep-2026/\" target=\"_blank\" rel=\"noopener\">TradingView/CoinMarketCal, Venice on NEAR, Sep 24<\/a><\/p><ul><li><b>Venice (VVV) is +14.4% over 7d (−3.2% over 24h), about 15% below its Sep 21 all-time high of $34.51.<\/b> Emissions drop from 2.5M to 2M VVV per year on <b>Oct 1<\/b>.<\/li><li>Fundamentals (self-reported): $100M annualized revenue run rate in August; $65M Series A at a $1B valuation (Dragonfly).<\/li><li>Risk: the top 100 wallets hold ~98% of supply.<\/li><\/ul><p>   <i>Substantive business, concentrated token.<\/i> <a href=\"https://decrypt.co/378840/what-is-vvv-privacy-ai-token-up-3000-percent-2026\" target=\"_blank\" rel=\"noopener\">Decrypt, Sep 21<\/a> · <a href=\"https://venice.ai/blog/tokenomics-update-credit-burns-and-diem-supply-expansion\" target=\"_blank\" rel=\"noopener\">Venice blog<\/a><\/p><ul><li><b>US regulation: the CLARITY Act failed its Senate vote (Sep 15), so the agencies are acting without Congress.<\/b><\/li><li>SEC: &quot;Innovation Exemption&quot; order on Sep 17 (5 years of relief for tokenized-stock trading venues); a crypto custody proposal sent to OMB.<\/li><li>CFTC: Chair Selig said &quot;It&#x27;s go time&quot; on Sep 24; two crypto prerules filed at OMB.<\/li><\/ul><p>   <i>Why it matters:<\/i> rules are arriving faster, but agency rules can be reversed by a future administration, unlike a statute. <i>Substantive.<\/i> <a href=\"https://thehill.com/policy/technology/6096345-trump-regulators-crypto-rules/\" target=\"_blank\" rel=\"noopener\">The Hill, Sep 17<\/a> · <a href=\"https://cryptogazette.com/cftc-selig-go-time-crypto-rules-perps/\" target=\"_blank\" rel=\"noopener\">CryptoGazette, Sep 24<\/a> · <a href=\"https://www.jonesday.com/en/insights/2026/09/the-secs-new-innovation-exemption-fiveyear-relief-for-trading-on-tokenized-securities-venues\" target=\"_blank\" rel=\"noopener\">Jones Day, Sep 2026<\/a><\/p>"},{"h":"(c) Filtered out","body":"<ul><li><b>Ripple/Securitize RLUSD–BlackRock BUIDL &quot;announcement&quot;<\/b>: recycled news from Sep 23, 2025.<\/li><li><b>Brave Wallet × NEAR Intents, dated &quot;Sep 26&quot;<\/b>: first announced Mar 11, 2026.<\/li><li><b>StreetInsider &quot;PHA and NEAR already exploded… AlphaPepe&quot;<\/b>: paid promotion.<\/li><li><b>Grayscale ZCSH High Income (options) ETF filing<\/b>: coverage mixes 2025 and 2026 dates, it is unverified and niche.<\/li><li><b>&quot;Shielded Bitcoin&quot; paper<\/b>: preliminary research with no launch.<\/li><li><b>Garlinghouse comments on XRP value drivers<\/b>: commentary, not news.<\/li><li><b>THORChain +20% and DASH +13.5%<\/b>: coverage points to technicals or privacy-sector sympathy, with no discrete fresh catalyst found.<\/li><li><b>Quack AI (Q) +36%, Bitway, Backpack (+104% 7d), RAIN, TIBBIR<\/b>: no link to his holdings or watchlist. Not investigated (these look like small-cap pumps).<\/li><li><b>&quot;$100K BTC&quot; targets and prediction-market bets<\/b>: speculation.<\/li><\/ul>"},{"h":"(d) Upcoming this week (ET)","body":"<ul><li><b>Mon Sep 28:<\/b> Nillion &quot;Covenants on Ethereum mainnet&quot; (per a CoinMarketCal listing, so treat as unconfirmed until it happens). ZCSH split record date (close). Speakers: Fed&#x27;s Barkin and ECB&#x27;s Lagarde.<\/li><li><b>Tue Sep 29:<\/b> US JOLTS (Aug), RBA decision. Fed speakers Goolsbee and Williams. This was the original XRPL Batch activation date, now moved to Oct 9.<\/li><li><b>Wed Sep 30:<\/b> <b>US PCE (Aug)<\/b> and final Q2 GDP. Fed speakers Cook and Kashkari. ZCSH split effective before the open. Zcash NU7 code-complete target. Unlocks: OP 31.3M (1.36% of supply), TIA 17.3M (1.79%).<\/li><li><b>Thu Oct 1:<\/b> <b>ISM Manufacturing<\/b>, jobless claims. Fed&#x27;s Logan and ECB&#x27;s Schnabel speak. <b>VVV emissions cut to 2M per year.<\/b> Unlocks: SUI 64.2M (1.57%, ~$61M at article prices), WLD 37.5M (1.03%). The routine monthly XRP escrow release also happens around the 1st.<\/li><li><b>Fri Oct 2:<\/b> <b>US Nonfarm Payrolls (Sep)<\/b>. ENA unlock (small).<\/li><li><b>Next:<\/b> Oct 5 Nillion Blacklight L1 mainnet with NIL node staking (CoinMarketCal) · Oct 6 Zcash NU7 testnet · Oct 8 XRPL PermissionDelegation (earliest, 5:25 PM ET) · Oct 9 XRPL Batch (earliest, 10:46 AM ET) · Oct 20 NU7 mainnet go/no-go · <b>Oct 28 FOMC (~70% odds of a hike)<\/b> · Nov 5 NU7 mainnet.<\/li><\/ul><p>Sources for the calendar: <a href=\"https://nordfx.com/market-news/forex-cryptocurrency-forecast-september-28-october-02-2026\" target=\"_blank\" rel=\"noopener\">NordFX weekly calendar<\/a>, <a href=\"https://crypto-corner.com/2026/09/22/upcoming-token-unlocks-sep-oct-2026/\" target=\"_blank\" rel=\"noopener\">Crypto-Corner unlocks, Sep 22<\/a>, <a href=\"https://www.tokenpost.com/news/technology/24349\" target=\"_blank\" rel=\"noopener\">TokenPost on XRPL, Sep 26<\/a>, <a href=\"https://www.tradingview.com/news/coinmarketcal:6a0d9c4bb094b:0-venice-token-vvv-emissions-fall-to-2m-annually-01-oct-2026/\" target=\"_blank\" rel=\"noopener\">TradingView/CoinMarketCal VVV<\/a>, <a href=\"https://www.tradingview.com/news/coinmarketcal:2e03350e8094b:0-nillion-encrypted-covenants-go-live-on-ethereum-mainnet-28-sep-2026/\" target=\"_blank\" rel=\"noopener\">TradingView/CoinMarketCal Nillion<\/a>.<\/p>"}]},{"h":"2026-09-27 (Sun), morning scan ~9:05–9:15 AM ET","intro":"<p><b>Data:<\/b> Coinbase Exchange public tickers/stats at <b>9:09 AM ET<\/b>; CoinGecko <code>/simple/price<\/code> + <code>/coins/markets<\/code> at <b>9:10 AM ET<\/b> (after 429 backoff). Markets snapshot saved to <code>ideas/data/markets-20260927-morning.json<\/code> and <code>ideas/data/coinbase-spot-20260927-morning.json<\/code>. Overnight scan (~1:00 AM ET) is above; this section is the delta + re-vet for the 8:56 AM idea pipeline.<\/p><p><b>Paper-trade status:<\/b> Marks run 9:05 AM ET — <b>0 open ideas<\/b>, 3 armed breakout watches still untriggered. Featured call remains <b>PASS<\/b> <code>2026-09-27-01<\/code> (logged 8:05 AM ET); morning re-vet did not clear a new trade.<\/p>","subs":[{"h":"(a) Market snapshot (morning vs overnight)","body":"<div class=\"tw\"><table><thead><tr><th><\/th><th>Price (AM ET)<\/th><th>24h<\/th><th>7d<\/th><th>30d<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td><b>BTC<\/b><\/td><td><b>$84,780–$84,784<\/b> (CG/CB)<\/td><td>+0.9%<\/td><td>+5.4%<\/td><td>+6.6%<\/td><td>Still <b>3.5%<\/b> under $87,397 breakout trigger (Sep 26 close $84,417)<\/td><\/tr><tr><td><b>XRP<\/b><\/td><td><b>$1.53<\/b><\/td><td>−1.0%<\/td><td>+11.4%<\/td><td>+8.3%<\/td><td><b>8.6%<\/b> under $1.6581 trigger; soft overnight<\/td><\/tr><tr><td>ETH<\/td><td>$2,704<\/td><td>+0.6%<\/td><td>+5.1%<\/td><td>+8.1%<\/td><td><b>4.1%<\/b> under $2,807 trigger<\/td><\/tr><tr><td>SOL<\/td><td>$123.2<\/td><td>+1.8%<\/td><td>+13.9%<\/td><td>+16.8%<\/td><td>Under chase gate<\/td><\/tr><tr><td>ZEC<\/td><td>$1,650–$1,652<\/td><td>+7.0%<\/td><td>+14.9%<\/td><td><b>+107%<\/b><\/td><td><b>Chase gate FAIL<\/b> (&gt;60% / 30d)<\/td><\/tr><tr><td>NEAR<\/td><td>$5.15<\/td><td>+6.3%<\/td><td>+43.4%<\/td><td><b>+177%<\/b><\/td><td><b>Chase gate FAIL<\/b>; Brave/Ondo/ETF narrative still hot<\/td><\/tr><tr><td>VVV<\/td><td>$30.06<\/td><td>+1.3%<\/td><td>+6.2%<\/td><td><b>+78%<\/b><\/td><td><b>Chase gate FAIL<\/b>; Oct 1 emissions cut still scheduled<\/td><\/tr><tr><td>QNT<\/td><td>$161<\/td><td>+55%<\/td><td>+151%<\/td><td><b>+153%<\/b><\/td><td><b>Chase / hype<\/b>; Clearing House deal already in price<\/td><\/tr><tr><td>PHA<\/td><td>$0.0687<\/td><td>−15.5%<\/td><td>+90%<\/td><td><b>+172%<\/b><\/td><td>Leverage unwind continuing; <b>avoid / not a long<\/b><\/td><\/tr><tr><td>NIL<\/td><td>$0.108<\/td><td>~0%<\/td><td>+117%<\/td><td><b>+147%<\/b><\/td><td>Chase gate FAIL<\/td><\/tr><tr><td>ROSE<\/td><td>$0.00877<\/td><td>+0.5%<\/td><td>+20.5%<\/td><td>+46%<\/td><td>Under chase but no base-rate setup<\/td><\/tr><tr><td>TAO<\/td><td>$330<\/td><td>−0.7%<\/td><td>+32.5%<\/td><td>+36%<\/td><td>Under chase; no discrete new catalyst this morning<\/td><\/tr><\/tbody><\/table><\/div>"},{"h":"(b) Items that clear the bar (morning delta)","body":"<ul><li><b>CoinDesk autopsy of the CLARITY Act failure (published today 8:00 AM ET).<\/b> Interviews with &gt;12 aides/industry sources: ethics fight around Trump’s crypto businesses, Coinbase’s January yield dispute delaying the calendar into midterms, Senate rewriting the House bill, and a last-ditch Tillis–Gallego ethics amendment reportedly cut off during the Sep 15 cloture vote. Outlook: hopes of a lame-duck revival, but a new Congress in January resets the process; agencies keep filling gaps.<\/li><\/ul><p>   <i>Horizon: mid/long.<\/i> <i>Substantive<\/i> (primary reporting). Not a trade signal. <a href=\"https://www.coindesk.com/news-analysis/2026/09/27/how-months-of-work-on-the-clarity-act-all-fell-apart\" target=\"_blank\" rel=\"noopener\">CoinDesk, Sep 27<\/a><\/p><ul><li><b>Spot BTC ETF week still the story — no weekend flow print.<\/b> Friday closed the +$2.39B week (Mon $999M → Fri $134.5M). BTC ~$84.8K Sunday morning, still below the ~$87.4K prior-20-day high. YTD ETF flows flipped positive (~$934M).<\/li><\/ul><p>   <i>Horizon: short/mid.<\/i> <i>Substantive<\/i> (SoSoValue / The Block, Sep 26). ETF-flow momentum as a 2:1 bracket trade already failed its own base-rate test (<code>ideas/research/btc_flow_study.json<\/code>). <a href=\"https://www.theblock.co/news/markets/2026-09-26-bitcoin-etfs-turn-positive-for-2026-with-2-4-billion-weekly-inflow-their-largest-since-october-416944\" target=\"_blank\" rel=\"noopener\">The Block, Sep 26<\/a> · <a href=\"https://www.coingabbar.com/en/bitcoin-news-today-btc-price-jumps-etf-inflows-surge\" target=\"_blank\" rel=\"noopener\">CoinGabbar, Sep 27<\/a><\/p><ul><li><b>NEAR weekend narrative stack (Brave Intents coverage, Ondo tokenized stocks via near.com, Bitwise NRR listing progress).<\/b> Price +6% on the day / +177% over 30 days. RSI reported overbought in secondary coverage. First NRR trade date still unconfirmed.<\/li><\/ul><p>   <i>Horizon: mid.<\/i> <i>Partnerships substantive; price is a chase.<\/i> Hard gate rejects. <a href=\"https://web3paper.net/en/news/37896\" target=\"_blank\" rel=\"noopener\">PAPER / CoinMarketCap, Sep 27<\/a> · <a href=\"https://spheric.news/near-streamlines-access-to-ondo-tokenized-stocks-across-30-networks/\" target=\"_blank\" rel=\"noopener\">Spheric, Sep 27<\/a><\/p><ul><li><b>Zcash: shielded usage + NU7 calendar unchanged; ZCSH split record date Mon Sep 28.<\/b> ZEC still parabolic (+107% / 30d). NU7: code-complete Sep 30 → testnet Oct 6 → go/no-go Oct 20 → mainnet Nov 5.<\/li><\/ul><p>   <i>Horizon: mid.<\/i> <i>Substantive network activity; chase gate blocks a long.<\/i> <a href=\"https://www.altcoinbuzz.io/zcash-price-bitcoin-privacy-rally\" target=\"_blank\" rel=\"noopener\">Altcoin Buzz, Sep 27<\/a><\/p><ul><li><b>Macro week ahead (official calendars).<\/b> Tue Sep 29 JOLTS (Aug) 10:00 AM ET · Wed Sep 30 PCE (Aug) + Q2 GDP third estimate 8:30 AM ET · Thu Oct 1 ISM Manufacturing + claims · Fri Oct 2 NFP (Sep) 8:30 AM ET · Oct 28 FOMC (~70% hike odds in prior week’s pricing). 10Y still near multi-decade highs after the Sep 16 25bp hike to 3.75–4.00%.<\/li><\/ul><p>   < ":false,"min_reward_risk":2.0,"min_stop_atr":1.0,"chase_limit_30d":0.6,"both_touched_same_bar":"stop first","paper_only":true,"the_bar":["Spot only, long only, no leverage. Nothing Casey couldn't buy outright on an exchange. Exception: the market-neutral funding-carry family (long spot + equal short perp, 1x collateral, paper only).","Don't chase: no asset already up big on leverage or hype (hard gate: >60% in 30 days is rejected; futures-driven spikes are rejected even below that).","Reward:risk of at least 2:1, with the stop set from real volatility (>= 1x ATR14, normally 1.5-2x ATR14) or a real level beyond that.","Base-rate reasoning with data: how often this kind of setup worked historically (n, win rate, avg net after 0.6% fees), compared with a no-setup baseline. Breakeven win rate at 2:1 is 33%.","Write the strongest argument against it, and what has to go right.","Invalidation stated up front. Time limit stated up front.","If nothing clears the bar: log a PASS with reasoning and the setup we're waiting for. Never force a trade.","Quality over quantity: 0-2 ideas a day. 'We are not looking for yolo.'"],"structural_families":{"structural-arb":"arb_scan.py: cross-venue prediction-market arbitrage, $500 per pair, opens only risk-low pairs with >8%/yr net after fees and T-bill charge and >=$500 size.","funding-carry":"carry.py: $1,000 long spot + $1,000 short perp per coin (BTC, XRP), market-neutral; explicit exception to the spot-only rule; paper only."},"adopted_rule_changes":[{"id":"P-004","filter":"near_1y_high","remove_gate":null,"title":"Add \"near 1-year high (within 10%)\" as a required condition for trend-breakout entries","adopted":"2026-10-06","applies_to":"trend-breakout family, altcoins only (BTC/ETH/XRP exempt by Casey 2026-10-07; still scored both ways daily)","evidence":"proposals.md P-004","exempt_symbols":["BTC","ETH","XRP"],"exemption":"Casey's decision 2026-10-07: majors exempt. On BTC/ETH/XRP alone P-004 tested slightly worse (+4.8% vs +5.5%  h+='<h2>What it means <small>my reading, not legal advice</small></h2><div class="card kv">'+K.impact.map(function(i){return '<div class="r"><b>'+esc(i.k)+'</b>'+esc(i.v)+'</div>';}).join('')+'</div>';
 h+='<h2>Sticking points</h2><div class="card"><p class="note" style="margin:0;color:#d3d8e3;font-size:13.5px">'+esc(K.sticking)+'</p></div>';
 h+='<h2>Sources</h2><div class="card srcs">'+K.sources.map(function(s){return '<a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>';}).join('')+'<p class="note">Full sourcing in the report (§9). Vote tally differs by outlet (50–49 vs 49–50).</p></div>';
 h+='</div></div>'+footer;
 $('#v-clarity').innerHTML=h;}

/* ---------- CALENDAR ---------- */
function renderCal(){
 var now=new Date();var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 var h='<div class="hdr"><div><div class="kick">Dated catalysts (ET)</div><h1>Calendar</h1></div><span class="pill">'+D.calendar.length+' events</span></div><div class="calcols">';
 var groups={},keys=[];
 D.calendar.forEach(function(e){var x=pd(e.d),k=x.y+'-'+x.m;if(!groups[k]){groups[k]=[];keys.push(k);}groups[k].push(e);});
 keys.forEach(function(k){var p=k.split('-');h+='<div class="mgrp"><div class="mo">'+MON[+p[1]-1]+' '+p[0]+'</div>';
  groups[k].forEach(function(e){var x=pd(e.d);var cd='',past=false;
   if(x.d){var dt=new Date(x.y,x.m-1,x.d);var n=Math.round((dt-today)/864e5);past=n<0;cd=n===0?'today':n===1?'tomorrow':n>0?'in '+n+' days':'past';}else cd='date TBC';
   h+='<div class="ev'+(past?' past':'')+'"><div class="db"><b>'+(x.d||'–')+'</b><span>'+MON[x.m-1]+'</span></div><div class="card bx"><div class="t">'+esc(e.t)+'</div><div class="ft"><span class="tagc t-'+esc(e.tag)+'">'+esc(e.tag)+'</span><span class="cd">'+cd+'</span>'+
   (e.coins||[]).filter(function(c){return C[c];}).map(function(c){return '<button class="cchip tap" data-coin="'+c+'">'+esc(C[c].sym)+'</button>';}).join('')+'</div></div></div>';});
  h+='</div>';});
 h+='</div><p class="note" style="margin:6px 2px">Countdowns use your device’s date. “Reported” items are unconfirmed.</p>'+footer;
 $('#v-cal').innerHTML=h;}

/* ---------- SHEET ---------- */
function chart(pts,c){
 if(!pts||pts.length<2)return '<p class="note">No 30-day chart in this data pull.</p>';
 var stl=(c&&c.chart_stale)?'<div class="note" style="margin:6px 2px"><span class="stale" style="margin-left:0">STALE CHART</span> last updated '+esc(c.chart_asof||'')+' (price source rate-limited this refresh)</div>':'';
 var W=600,H=220,P=6,ys=pts.map(function(p){return p[1];}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys),rg=mx-mn||1;
 var up=ys[ys.length-1]>=ys[0],col=up?'#4ade80':'#f87171';
 function X(i){return i/(pts.length-1)*W;} function Y(v){return P+(1-(v-mn)/rg)*(H-2*P);}
 var d=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+','+Y(p[1]).toFixed(1);}).join('');
 var imx=ys.indexOf(mx),imn=ys.indexOf(mn);
 var s='<div class="cread" id="cread">30-day range '+fp(mn)+' – '+fp(mx)+'</div><div class="cw"><svg id="chsvg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="aspect-ratio:'+W+'/'+H+'"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".32"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>';
 [0.25,0.5,0.75].forEach(function(f){s+='<line x1="0" x2="'+W+'" y1="'+(H*f)+'" y2="'+(H*f)+'" stroke="#1e2433" stroke-width="1" vector-effect="non-scaling-stroke"/>';});
 s+='<path d="'+d+'L'+W+','+H+'L0,'+H+'Z" fill="url(#cg)"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
 s+='<circle cx="'+X(imx)+'" cy="'+Y(mx)+'" r="3.5" fill="'+col+'"/><circle cx="'+X(imn)+'" cy="'+Y(mn)+'" r="3.5" fill="#94a3b8"/>';
 s+='<line id="chx" x1="0" x2="0" y1="0" y2="'+H+'" stroke="#c3c9d6" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0"/><circle id="chd" r="5" fill="#fff" stroke="'+col+'" stroke-width="2" opacity="0"/></svg></div>';
 var f=function(t){var x=new Date(t*1000);return MON[x.getMonth()]+' '+x.getDate();};
 s+='<div class="cax"><span>'+f(pts[0][0])+'</span><span>High '+fp(mx)+' · Low '+fp(mn)+'</span><span>'+f(pts[pts.length-1][0])+'</span></div>';
 return stl+s;}
function bindChart(pts){var svg=$('#chsvg');if(!svg)return;var W=600,H=220,P=6,ys=pts.map(function(p){return p[1];}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys),rg=mx-mn||1;
 var lx=$('#chx'),dt=$('#chd'),rd=$('#cread'),def=rd.innerHTML;
 function mv(e){var r=svg.getBoundingClientRect();var cx=(e.touches?e.touches[0].clientX:e.clientX);var i=Math.round((cx-r.left)/r.width*(pts.length-1));i=Math.max(0,Math.min(pts.length-1,i));
  var x=i/(pts.length-1)*W,y=P+(1-(pts[i][1]-mn)/rg)*(H-2*P);lx.setAttribute('x1',x);lx.setAttribute('x2',x);lx.setAttribute('opacity',.6);dt.setAttribute('cx',x);dt.setAttribute('cy',y);dt.setAttribute('opacity',1);
  var d=new Date(pts[i][0]*1000);rd.innerHTML='<b style="color:#fff">'+fp(pts[i][1])+'</b> · '+MON[d.getMonth()]+' '+d.getDate()+', '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})+' ET';}
 function out(){lx.setAttribute('opacity',0);dt.setAttribute('opacity',0);rd.innerHTML=def;}
 svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);svg.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')out();});svg.addEventListener('touchmove',mv,{passive:true});}
var lastFocus=null;
function openCoin(id){var c=C[id];if(!c)return;var m=c.m;lastFocus=document.activeElement;
 $('#sht').innerHTML='<div style="min-width:0"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="sym" style="font-size:16px'+(c.holding?';color:#fcd34d':'')+'">'+esc(c.sym)+'</span><span class="nm" style="font-size:14px">'+esc(c.name)+'</span>'+badges(c)+'</div><div style="font-size:11.5px;color:var(--dim);margin-top:3px">'+esc(laneName(c.lane))+(m.rank?' · rank #'+m.rank:'')+'</div></div><button class="x" id="xbtn" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
 var h='<div class="big">'+fp(m.price)+'</div><div class="chg"><span><b>24h</b>'+pc(m.ch24)+'</span><span><b>7d</b>'+pc(m.ch7)+'</span><span><b>30d</b>'+pc(m.ch30)+'</span></div>';
 h+=chart(c.chart,c);
 h+='<div class="kg"><div><span>Mkt cap</span><b>'+fc(m.mcap)+'</b></div><div><span>FDV</span><b>'+fc(m.fdv)+'</b></div><div><span>24h vol</span><b>'+fc(m.vol)+'</b></div><div><span>ATH</span><b>'+fp(m.ath)+'</b></div><div><span>From ATH</span><b>'+pc(m.athchg)+'</b></div><div><span>FDV / cap</span><b>'+(m.fdv&&m.mcap?(m.fdv/m.mcap).toFixed(1)+'×':'—')+'</b></div></div>';
 h+='<div class="rate">'+dots(c.rating.score)+'<div><div class="rl">'+esc(c.rating.label)+'</div><div class="rs">Substantive-vs-hype rating: '+c.rating.score+'/5 (5 = most substantive)</div></div></div>';
 h+='<div class="sec"><h4>What it is</h4><p>'+esc(c.what)+'</p></div><div class="sec"><h4>AI angle</h4><p>'+esc(c.ai)+'</p></div>';
 h+='<div class="bb"><div class="card bull"><h4 style="font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px">Bull case</h4><p>'+esc(c.bull)+'</p></div><div class="card bear"><h4 style="font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px">Bear case / risks</h4><p>'+esc(c.bear)+'</p></div></div>';
 h+='<div class="sec"><h4>Sources</h4><div class="srcs">'+c.sources.map(function(s){return '<a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>';}).join('')+'</div></div>';
 h+='<p class="note" style="margin-top:14px">Price data: CoinGecko, '+esc(D.pulled)+'. Not financial advice.</p>';
 $('#sb').innerHTML=h;$('#sb').scrollTop=0;
 $('#ov').classList.add('on');$('#sheet').classList.add('on');document.body.classList.add('lock');
 $('#xbtn').onclick=closeSheet;if(c.chart)bindChart(c.chart);setTimeout(function(){$('#xbtn').focus({preventScroll:true});},50);
 if(location.hash.indexOf('coin=')<0)history.pushState({coin:id},'','#'+cur+'/coin='+id);}
function closeSheet(fromPop){if(!$('#sheet').classList.contains('on'))return;$('#ov').classList.remove('on');$('#sheet').classList.remove('on');$('#sheet').style.transform='';document.body.classList.remove('lock');
 if(!fromPop&&location.hash.indexOf('coin=')>=0)history.back();if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});}
$('#ov').onclick=function(){closeSheet();};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('.node')){e.preventDefault();openCoin(e.target.closest('.node').dataset.coin);}});
(function(){var sh=$('#sh'),sheet=$('#sheet'),y0=null,dy=0;
 sh.addEventListener('touchstart',function(e){if(window.innerWidth>=1000)return;y0=e.touches[0].clientY;dy=0;sheet.style.transition='none';},{passive:true});
 sh.addEventListener('touchmove',function(e){if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sheet.style.transform='translateY('+dy+'px)';},{passive:true});
 sh.addEventListener('touchend',function(){if(y0==null)return;sheet.style.transition='';sheet.style.transform='';if(dy>90)closeSheet();y0=null;});})();
document.addEventListener('click',function(e){var t=e.target.closest('[data-coin]');if(t&&!t.closest('#sheet')){openCoin(t.dataset.coin);}});
document.addEventListener('click',function(e){var g=e.target.closest('[data-go]');if(g){closeSheet(true);show(g.dataset.go,true);}});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('[data-go]')){e.preventDefault();show(e.target.closest('[data-go]').dataset.go,true);}});

/* ---------- ROUTER ---------- */
var cur='home';var R={home:renderHome,ideas:renderIdeas,pulse:renderPulse,watch:renderWatch,lanes:renderLanes,clarity:renderClarity,cal:renderCal};var done={};
function show(v,push){if(!R[v])v='home';if(!done[v]){R[v]();done[v]=1;}cur=v;
 document.querySelectorAll('.view').forEach(function(s){s.classList.toggle('on',s.id==='v-'+v);});
 document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v);});
 window.scrollTo(0,0);if(push)history.replaceState(null,'','#'+v);}
$('#tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;closeSheet(true);show(b.dataset.v,true);};
window.addEventListener('popstate',function(){var h=location.hash.slice(1);if(h.indexOf('coin=')<0)closeSheet(true);var v=h.split('/')[0];if(v&&v!==cur&&R[v])show(v,false);});
var h0=location.hash.slice(1).split('/');show(h0[0]||'home',false);var cm=/coin=([\w-]+)/.exec(location.hash);if(cm&&C[cm[1]]){history.replaceState(null,'','#'+cur);openCoin(cm[1]);}
})();
</script>
</body></html>

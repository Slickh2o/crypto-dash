sions usually dwarf customer revenue. Render emissions ~13× burns.","facts":["BlackRock (Sep 2026) calls standardized claims on compute capacity a potential new digital-asset class (compute contracts and futures settled on-chain). It names no GPU tokens; Stripe–OpenRouter (Aug 2026) is its example."],"sources":[{"t":"BlackRock: The Machine-Native Economy (PDF)","u":"https://www.blackrock.com/us/individual/literature/whitepaper/the-machine-native-economy.pdf"},{"t":"Stripe: agrees to acquire OpenRouter (Aug 19)","u":"https://stripe.com/newsroom/news/stripe-agrees-to-acquire-openrouter"}]},{"id":"training","n":2,"title":"Training & Models","color":"#34d399","desc":"Networks that pay contributors to train models, run inference, or compete on AI tasks.","reality":"Bittensor subnets earn ~$28–35M/yr — tiny vs $3.6B. Prime Intellect (no token) and Nous (no confirmed token) lead real decentralized training."},{"id":"agents","n":3,"title":"Agents & Agent Payments","color":"#60a5fa","desc":"AI agents with wallets that pay per API call, usually in stablecoins.","reality":"The biggest 2025–26 story, but it settles in USDC: x402 ≈ $24M / 30 days, ~99% USDC; TRM estimates only 0.6–7.5% is genuine agent activity.","facts":["BlackRock (Sep 2026, “The Machine-Native Economy”): stablecoins are “likely to lead” agent payments over x402, MPP, ACP and AP2; greater usage could raise demand for blockspace (e.g. ETH)."],"sources":[{"t":"BlackRock: The Machine-Native Economy (PDF)","u":"https://www.blackrock.com/us/individual/literature/whitepaper/the-machine-native-economy.pdf"},{"t":"Cointelegraph (Sep 23)","u":"https://cointelegraph.com/news/ai-potential-to-drive-crypto-demand-remains-underappreciated-blackrock"}]},{"id":"data","n":4,"title":"Data Networks","color":"#fb923c","desc":"Storage, indexing and data supply for training AI.","reality":"Grass has meaningful (self-reported) revenue; the storage giants have an AI narrative but no verified AI revenue."},{"id":"privacy","n":5,"title":"Privacy + Confidential AI","color":"#a78bfa","desc":"Run AI on encrypted or sealed hardware so nobody — not even the host — sees prompts or data. The thread linking NEAR, ZEC and Venice.","reality":"Hottest lane of Sep 2026, largely leverage-driven. Big tech (Apple PCC on Nvidia confidential GPUs) validates confidential AI without any token. EU AMLR bars exchange-listed anonymity coins from Jul 10, 2027. BlackRock’s Sep 2026 agent-economy paper never mentions privacy or privacy coins."},{"id":"personhood","n":6,"title":"Proof of Personhood","color":"#f472b6","desc":"Proving you're human in a world full of bots.","reality":"World is the only scaled player; zkML / verifiable inference is mostly early-stage."},{"id":"miners","n":7,"title":"Picks & Shovels (equities)","color":"#94a3b8","desc":"Bitcoin miners turning power and sites into AI data centers — stocks, not tokens.","reality":"Arguably the largest real-dollar crypto × AI crossover. Risks: construction/power delays, customer concentration, capex.","facts":["IREN: $9.7B 5-year Microsoft contract (200MW Nvidia GB300); FY26 AI cloud revenue $128.8M vs $16.4M; first capacity accepted by Aug 26, 2026.","Cipher Mining: 168MW, 10-year AI hosting deal with Fluidstack (Sep 25, 2025)."],"sources":[{"t":"IREN FY26 results","u":"https://www.globenewswire.com/news-release/2026/08/27/3352401/0/en/iren-reports-fy26-results.html"},{"t":"Cipher–Fluidstack","u":"https://www.globenewswire.com/news-release/2025/09/25/3156107/0/en/Cipher-Mining-Signs-168-MW-10-Year-AI-Hosting-Agreement-with-Fluidstack.html"}]}],"links":[{"a":"venice-token","b":"near","kind":"confirmed","label":"Venice runs private inference on NEAR AI TEEs","since":"Live since Mar 19, 2026"},{"a":"zcash","b":"near","kind":"confirmed","label":"Zashi/Zodl private swaps via NEAR Intents","since":"Live since Oct 2025"},{"a":"pha","b":"venice-token","kind":"confirmed","label":"Phala is also a Venice TEE provider","since":"Live"},{"a":"venice-token","b":"zcash","kind":"unofficial","label":"Venice ↔ Zcash: community workarounds only","since":"Not official"}],"clarity":{"status":"Passed the House; Senate cloture failed Sep 15 (49–50). Agencies writing rules without Congress. Not law.","plain":["Draws the line: commodity-like tokens → CFTC; securities-like tokens → SEC.","Registers exchanges, brokers and dealers with custody and conflict rules.","Creates a 'graduation' path from SEC to commodity status as networks decentralize.","Today the split rests only on agency interpretations a future SEC/CFTC could reverse."],"impact":[{"k":"BTC","v":"Already treated as a commodity; marginal direct effect, sentiment positive if passed."},{"k":"XRP","v":"Would cement the Mar 2026 'digital commodity' label — supports ETF/bank adoption."},{"k":"AI tokens","v":"None on the named commodity list; many look securities-like. They'd benefit most from a graduation path."}],"timeline":[{"d":"2025-05-29","t":"Introduced in the House (H.R. 3633)","s":"done"},{"d":"2025-06","t":"House committees advance it (32–19 and 47–6)","s":"done"},{"d":"2025-07-17","t":"Passes the full House 294–134","s":"done"},{"d":"2026-01-29","t":"Senate Agriculture advances companion text 12–11","s":"done"},{"d":"2026-03-17","t":"SEC/CFTC name BTC, ETH, XRP, SOL, ADA, LINK, DOGE 'digital commodities' (agency action)","s":"done"},{"d":"2026-05-14","t":"Senate Banking advances its version 15–9","s":"done"},{"d":"2026-08-08","t":"Cloture filed","s":"done"},{"d":"2026-09-15","t":"Cloture fails (needed 60; reported 50–49 or 49–50). BTC fell >5%.","s":"fail"},{"d":"2026-09-17","t":"Seven Democrats: 'a setback, not the end'","s":"done"},{"d":"2026-09-27","t":"CoinDesk autopsy: ethics + midterms + Senate rewrite sank cloture; lame-duck possible, else reset in Jan","s":"done"},{"d":"2026-10-05","t":"Senate recess begins (through Nov 6)","s":"next"},{"d":"2026-10-20","t":"SEC 'Regulation Crypto Assets' comments due","s":"next"},{"d":"2026-11-03","t":"Midterm elections","s":"next"},{"d":"20 ase gate<\/td><\/tr><tr><td>VVV (Venice)<\/td><td>$29.55<\/td><td>+5.6%<\/td><td>+6.3%<\/td><td><b>+71%<\/b><\/td><td>Now <b>over<\/b> the 60% chase gate; OI +17% 7d<\/td><\/tr><tr><td>QNT<\/td><td>$260.01<\/td><td>+1.2%<\/td><td>+12.9%<\/td><td><b>+301%<\/b><\/td><td>Hard chase<\/td><\/tr><tr><td>FET<\/td><td>$0.2597<\/td><td>+7.3%<\/td><td>+15.6%<\/td><td>+57.7%<\/td><td>Leverage <b>WARM<\/b> (OI +46% 7d, funding 17% APR)<\/td><\/tr><tr><td>TAO<\/td><td>$304.02<\/td><td>~0%<\/td><td>−1.3%<\/td><td>+28.7%<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><p><b>Leverage (signals.md):<\/b> BTC/XRP/ETH/ZEC/NEAR/VVV/TAO/SOL all <b>COOL<\/b>. <b>AKT HOT<\/b>. PHA, NIL, FET, VIRTUAL, ARX, IO are <b>WARM<\/b>. Stablecoin supply $312.17B, 7d +0.23% / 30d +1.07% (flat to slowly growing; USDC −1.65% 7d, RLUSD −2.34% 7d). BTC DVOL 36.04 (±1.9% implied daily); ETH DVOL 48.91. Polymarket BTC &quot;↑ $87.5K in October&quot; is 82.5% (+5 pts 1d).<\/p><p><b>ETF flows:<\/b> US spot BTC ETFs <b>+$241.1M<\/b> last week, the third straight inflow week, but only a tenth of the prior week&#x27;s +$2.4B (SoSoValue via Cointelegraph). Farside 5-day is +$210.1M. ETH <b>−$138M<\/b>. <b>ZEC funds −$94M, their first weekly outflow on record.<\/b> XRP <b>+$4.74M<\/b> (vs $75.6M the week before; Fri −$3.28M), SOL +$2.4M. Fear &amp; Greed 70 (&quot;Greed&quot;, down from 74).<\/p>"},{"h":"(b) Items that matter","body":"<ul><li><b>BTC is pressing the $87.4K breakout, but there&#x27;s no trigger yet (short).<\/b> Oct 4 UTC close $86,507 (+2.1% d/d) is the closest to the $87,397 watch since it was armed. Leverage stays COOL (funding 7d 4.9% APR, OI 7d +0.1%), so it isn&#x27;t a leverage squeeze. Yahoo Finance ties the move to the soft jobs report pulling hike expectations down. A test run today found that <b>buying early (0–1.5% under the 20d high) has no ETF-era edge for BTC<\/b> (n=12, 33% win, +0.5% avg). Wait for the daily close. <i>Horizon: short. Hype: low.<\/i> <a href=\"https://finance.yahoo.com/personal-finance/investing/article/bitcoin-and-ethereum-prices-today-monday-october-5-2026-bitcoin-back-above-86000-after-higher-rate-expectations-fade-114459647.html\" target=\"_blank\" rel=\"noopener\">Yahoo Finance, Oct 5<\/a> · [research/near_breakout_study.json]<\/li><li><b>Rates: the soft jobs report cut October hike odds, but a December hike is still the base case (short/mid).<\/b> Sep NFP was +29K (unemployment 4.2%, wages +3.0% y/y) (<a href=\"https://www.cnbc.com/2026/10/02/fed-rate-hike-odds-decline-after-september-jobs-report.html\" target=\"_blank\" rel=\"noopener\">CNBC, Oct 2<\/a>; <a href=\"https://cepr.net/publications/september-2026-jobs-report/\" target=\"_blank\" rel=\"noopener\">CEPR<\/a>). Polymarket Oct hold is 82.5% / hike 16.5%; Kalshi maintain 82% / hike 18%. <b>Kalshi &quot;hike before 2027&quot; is 74%.<\/b> The 10-yr is at 5.24%. <b>FOMC minutes Wed Oct 7<\/b> are the next rate event (<a href=\"https://coinbeat.news/bitcoin-hits-86-160-as-traders-await-fed-minutes\" target=\"_blank\" rel=\"noopener\">CoinBeat<\/a>). <i>Horizon: short/mid.<\/i><\/li><li><b>Zcash NU7 is live on testnet two days early, while ZEC funds see their first outflow (mid).<\/b> Activation block 4,465,026 was mined Oct 4 18:21 UTC. The mainnet height decision is <b>Oct 20<\/b>, with a <b>Nov 5<\/b> target. It brings 25-second blocks, disables v4 transactions, and makes Sprout funds unspendable unless they&#x27;re moved first (<a href=\"https://cointelegraph.com/news/zcash-nu7-testnet-activation-november-mainnet\" target=\"_blank\" rel=\"noopener\">Cointelegraph, Oct 5<\/a>). This is real execution progress, but price is −10.5% for the week and ZEC funds lost ~$94M. The tape says sell-the-news. <i>Horizon: mid. Hype flag on any &quot;buy the upgrade&quot; pitch.<\/i><\/li><li><b>XRPL amendments, Oct 8–9 (mid).<\/b> On-chain feed: PermissionDelegationV1_1 is at <b>29/35 (margin 1)<\/b>, earliest <b>Oct 8, 5:25 PM ET<\/b>. fixBatchV1_2 is 35/35 and BatchV1_1 30/35, both <b>Oct 9 ~10:12–10:46 AM ET<\/b>. ⚠️ InteractiveCrypto (Oct 5) says PermissionDelegation is &quot;live&quot;, but that contradicts the validator feed and ad-hoc-news. Treat it as <b>unverified<\/b>. Also notable: Ripple&#x27;s Monica Long described XRP-as-collateral credit pilots targeting <b>2027<\/b> (<a href=\"https://coinpaper.com/36775/ripples-new-credit-business-could-give-xrp-a-new-source-of-demand\" target=\"_blank\" rel=\"noopener\">coinpaper, Oct 5<\/a>). That&#x27;s a long-horizon demand idea, not a near-term catalyst. XRP ETF weekly inflow slowed to +$4.74M (<a href=\"https://www.panews.io/articles/01a109ed-2266-75aa-b31c-7697c8ec7fca\" target=\"_blank\" rel=\"noopener\">PANews<\/a>). <i>Horizon: mid/long.<\/i><\/li><li><b>Nillion Blacklight L1 mainnet launched Oct 5 (privacy+AI, short).<\/b> Node staking needs a 70,000-NIL minimum, with 0.5%/yr inflation rewards (<a href=\"https://nillion.com/news/blacklight-node-migration-the-move-to-ethereum-l1/\" target=\"_blank\" rel=\"noopener\">Nillion, Sep 26<\/a>; <a href=\"https://www.tradingview.com/news/coinmarketcal:51f89647b094b:0-ethereum-blacklight-l1-mainnet-launches-with-nil-node-staking-and-inflation-rewards-05-oct-2026/\" target=\"_blank\" rel=\"noopener\">TradingView/CoinMarketCal<\/a>). The event happened as scheduled. NIL is <b>WARM<\/b> (OI +47% 1d, OI = 20% of mcap): leverage into a launch day. <i>Horizon: short. Hype/leverage flag.<\/i><\/li><li><b>CLARITY is still stalled as the Senate returns (long).<\/b> The Senate is back Oct 5 with fewer than 36 legislative days left. Lummis&#x27;s &quot;CLARITY 2.0&quot; substitute text exists, but nothing is scheduled. The agencies are moving instead: the SEC Regulation Crypto Assets comment period closes <b>Oct 20<\/b>, and the CFTC crypto rule is at OIRA (<a href=\"https://www.orrick.com/Insights/2026/10/The-CLARITY-Act-Stalls-in-the-Senate-Whats-Next-for-Digital-Asset-Regulation\" target=\"_blank\" rel=\"noopener\">Orrick<\/a>; <a href=\"https://unbiasedheadlines.com/article/clarity-act-stays-dead-in-the-senate-as-agencies-push-crypto-rules-forward-without-it\" target=\"_blank\" rel=\"noopener\">Unbiased Headlines<\/a>). Polymarket signed-in-2026 is <b>5.1%<\/b>; Kalshi before 2027 is 6.0% (+1 pt). <i>Horizon: long. Hype: low.<\/i><\/li><\/ul>"},{"h":"(c) Filtered out","body":"<ul><li><b>&quot;AI token rotation&quot; (FET/VIRTUAL/NEAR, FXStreet Oct 5):<\/b> FET and VIRTUAL are leverage WARM with OI rising fast, and NEAR is +130%/30d. That&#x27;s a narrative with leverage behind it. <a href=\"https://www.fxstreet.com/cryptocurrencies/news/ai-tokens-price-prediction-capital-rotation-fuels-fet-virtual-and-near-rallies-202610051017\" target=\"_blank\" rel=\"noopener\">FXStreet<\/a><\/li><li><b>VVV (+71%/30d):<\/b> now fails the chase gate.<\/li><li><b>QNT (+301%/30d), AKT (HOT):<\/b> chase / leverage.<\/li><li><b>&quot;CoinShares: 4th week of outflows, BTC down ~50% from ATH&quot; (nftaiverse, dated Oct 5):<\/b> its numbers don&#x27;t match today&#x27;s market (BTC is ~32% off its ATH, and Friday was NFP, not CPI). It looks like a recycled older report. <b>Unreliable, ignored.<\/b><\/li><li><b>&quot;PermissionDelegation is live&quot; (InteractiveCrypto):<\/b> contradicted by the amendment feed. Unverified.<\/li><li><b>Front-running the BTC breakout:<\/b> tested today, no ETF-era edge.<\/li><\/ul>"},{"h":"(d) Idea pipeline","body":"<p><b>PASS logged for Oct 5<\/b> (ledger id 2026-10-05-01), the 5th straight pass day. No armed watch triggered. BTC is the closest at <b>+1.0%<\/b>, then ETH +2.9% and XRP +9.1%. A trigger is not an automatic entry; re-vet with <code>add_idea.py<\/code> if one flips. New research file: <code>ideas/research/near_breakout_study.py/.json<\/code> (early entry vs confirmed breakout). Structural: arb_scan found 1 after-fee opportunity (Satoshi-moves-BTC, medium risk, $311, 2.1% ann). It doesn&#x27;t qualify for a paper open. Funding-carry: 2 pairs, 7.91 days, funding $4.30, net if closed −$1 t close; ETF-flow momentum family previously failed.<\/li><\/ul>"},{"h":"(d) Idea pipeline","body":"<p>PASS logged for Oct 3 (see ideas ledger). No armed watch triggered (BTC/XRP/ETH). Watches stay armed at $87,397 / $1.6581 / $2,807.10 — trigger ≠ auto-entry; re-vet with <code>add_idea.py<\/code> if any flips. Structural: arb_scan found 3 after-fee opportunities (median ~1.9% ann, mostly tiny/$sports); funding-carry 2 pairs still net negative vs T-bill after ~6 days (entry fees dominating).<\/p><p>Sources: Coinbase spot + CoinGecko markets (Oct 3 ~9:05 AM ET); <code>data/signals.md<\/code> / <code>ideas/arb_scan.md<\/code> / <code>ideas/carry.md<\/code> / <code>ideas/scoreboard.md<\/code> from mark.py; NPR/BLS, crypto.news, ZIP 259, Zcash forum, XRPSCAN/cryptoticker, VCP Crypto (all Oct 2–3).<\/p>"}]},{"h":"2026-10-02 (Fri), week-in-review catch-up ~5:00-5:30 PM ET","intro":"<p><b>Why this is late:<\/b> the scheduled 8:56 AM radar and the CLARITY watch both failed on the platform side (&quot;Activity task failed&quot;), and there were no radar scans Sep 28 - Oct 1. This entry was written by hand from public sources the same afternoon. CoinGecko was rate-limiting (HTTP 429), so prices below are from Coinbase and news recaps.<\/p>","subs":[{"h":"(a) Market snapshot (Sep 27 00:00 UTC to Fri Oct 2, 5:15 PM ET, Coinbase)","body":"<div class=\"tw\"><table><thead><tr><th>Coin<\/th><th>Sep 27 open<\/th><th>Oct 2, 5:15 PM ET<\/th><th>Change<\/th><\/tr><\/thead><tbody><tr><td>BTC<\/td><td>$84,417<\/td><td>$84,486<\/td><td>+0.1%<\/td><\/tr><tr><td>ETH<\/td><td>$2,695.5<\/td><td>$2,662.8<\/td><td>-1.2%<\/td><\/tr><tr><td>XRP<\/td><td>$1.5271<\/td><td>$1.4727<\/td><td>-3.6%<\/td><\/tr><\/tbody><\/table><\/div><p>BTC spiked to $87,249 on today&#x27;s jobs print (Coinbase daily high) and gave it back, closing nowhere near the $87,397 breakout trigger. Press recaps quote +2% weekly for BTC because they measure from the Wed/Thu lows. Spot BTC ETFs: +$51M over Sep 28 - Oct 1 after +$2.39B the week before; spot ETH ETFs -$101M (Farside). <a href=\"https://cryptopotato.com/bitcoin-rejected-at-87k-despite-soft-pce-and-jobs-data-as-qnt-night-explode-weekly-crypto-recap/\" target=\"_blank\" rel=\"noopener\">CryptoPotato weekly recap, Oct 2<\/a><\/p>"},{"h":"(b) Items that matter","body":"<ul><li><b>Jobs (Oct 2):<\/b> Sep payrolls +29K vs ~84-90K expected; unemployment 4.2%; July revised to -10K, August to +133K. Fed-hike odds fell (Kalshi Oct 28 hold ~82%). <a href=\"https://www.cnbc.com/2026/10/02/jobs-report-september-2026.html\" target=\"_blank\" rel=\"noopener\">CNBC<\/a><\/li><li><b>PCE / GDP (Sep 30):<\/b> Aug PCE +0.3% m/m, 3.4% y/y; core 3.0% y/y, both below forecasts. Q2 GDP third estimate +2.2% (from 1.5%). <a href=\"https://www.bea.gov/news/2026/personal-income-and-outlays-august-2026\" target=\"_blank\" rel=\"noopener\">BEA<\/a><\/li><li><b>CLARITY Act:<\/b> no change since the Sep 15 cloture failure (49-50); Tillis&#x27;s motion to reconsider is pending, no new vote scheduled, Senate state work period Oct 5 - Nov 6. Polymarket &quot;signed into law in 2026&quot; 4.8%. <a href=\"https://www.dlapiper.com/en-us/insights/publications/2026/09/senate-fails-to-advance-the-clarity-act\" target=\"_blank\" rel=\"noopener\">DLA Piper<\/a><\/li><li><b>XRPL amendments:<\/b> PermissionDelegationV1_1 29/35 validators (needs more than 28, margin of 1) projected Oct 8; fixBatchV1_2 34/35 and BatchV1_1 30/35 projected Oct 9. LendingProtocolV1_1 opened for voting Sep 30 but only 9/35. <a href=\"https://xrpldashboard.com/amendments\" target=\"_blank\" rel=\"noopener\">xrpldashboard<\/a><\/li><li><b>Zcash NU7:<\/b> official testnet activation scheduled Oct 6, mainnet target Nov 5; so far only on the staging testnet. <a href=\"https://zips.z.cash/zip-0259\" target=\"_blank\" rel=\"noopener\">ZIP 259<\/a><\/li><li><b>VVV:<\/b> emissions cut 2.5M to 2M/yr took effect Oct 1; price was -14.75% over 7 days by Oct 2. The pre-announced cut did not lift it. <a href=\"https://coinstats.app/ai/a/latest-news-for-venice-token\" target=\"_blank\" rel=\"noopener\">CoinStats<\/a><\/li><\/ul>"},{"h":"(c) Filtered out","body":"<ul><li>QNT (+160% week) and NIGHT (+105% week): chases; fail the +60%/30d gate.<\/li><\/ul>"},{"h":"(d) Idea pipeline","body":"<p>PASS logged for Oct 2 (id 2026-10-02-01). No armed watch triggered (BTC/XRP/ETH). Waiting for a daily UTC close above $87,397 / $1.6581 / $2,807.10.<\/p><p>Sources: Coinbase public API (Oct 2, ~5:15 PM ET); CNBC, NPR, BEA, DLA Piper, xrpldashboard, ZIP 259, CoinStats, CryptoPotato (all Oct 2 or Sep 30).<\/p>"}]},{"h":"2026-09-27 (Sun), scan run ~12:57–1:07 AM ET","intro":"<p><b>Data:<\/b> CoinGecko free API. Watchlist pulled <b>00:58:33 ET<\/b> (CoinGecko <code>last_updated<\/code> 00:56 ET). PHA pulled separately at 01:03 ET because its CoinGecko id is <code>pha<\/code>, not <code>phala-network<\/code>. Global data timestamp is 00:50 ET. Trending and the top-250 list were pulled ~00:59–01:00 ET. The ranks 251–300 page hit CoinGecko&#x27;s rate limit (HTTP 429) on every retry, so gainers cover the top 250 only. Raw JSON is in <code>/workspace/crypto-ai/radar-2026-09-27/<\/code>. Venice id verified: <code>venice-token<\/code> (VVV, rank #68).<\/p><p><b>Dashboard:<\/b> <code>/workspace/crypto-ai/radar-2026-09-27/dashboard.png<\/code>. The 7-day sparklines use CoinGecko&#x27;s <code>sparkline_in_7d<\/code> series from <code>/coins/markets<\/code>.<\/p>","subs":[{"h":"(a) Market snapshot","body":"<div class=\"tw\"><table><thead><tr><th><\/th><th>Price<\/th><th>24h<\/th><th>7d<\/th><th>Mcap / rank<\/th><\/tr><\/thead><tbody><tr><td><b>Total crypto mcap<\/b><\/td><td><b>$2.90T<\/b><\/td><td>−2.4%<\/td><td><\/td><td>BTC dominance <b>58.3%<\/b>, ETH 11.3%, 24h volume $57B<\/td><\/tr><tr><td><b>BTC<\/b> (holding)<\/td><td><b>$84,306<\/b><\/td><td>+0.4%<\/td><td>+5.1%<\/td><td>$1.69T, #1<\/td><\/tr><tr><td><b>XRP<\/b> (holding)<\/td><td><b>$1.51<\/b><\/td><td>−3.1%<\/td><td>+10.6%<\/td><td>$94.8B, #5<\/td><\/tr><tr><td>ETH<\/td><td>$2,691.77<\/td><td>+0.1%<\/td><td>+4.9%<\/td><td>#2<\/td><\/tr><tr><td>SOL<\/td><td>$120.17<\/td><td>−0.4%<\/td><td>+12.2%<\/td><td>#7<\/td><\/tr><tr><td>ZEC<\/td><td>$1,634.68<\/td><td>+6.3%<\/td><td>+12.9%<\/td><td>$27.7B, #9<\/td><\/tr><tr><td>XMR<\/td><td>$561.18<\/td><td>+0.6%<\/td><td>+6.5%<\/td><td>#13<\/td><\/tr><tr><td>NEAR<\/td><td>$5.07<\/td><td>+3.7%<\/td><td>+44.7%<\/td><td>$6.63B, #22<\/td><\/tr><tr><td>VVV (Venice)<\/td><td>$29.32<\/td><td>−3.2%<\/td><td>+14.4%<\/td><td>$1.41B, #68<\/td><\/tr><tr><td>ZAMA<\/td><td>$0.0885<\/td><td>−1.3%<\/td><td>+12.9%<\/td><td>#182<\/td><\/tr><tr><td>ROSE (Oasis)<\/td><td>$0.00874<\/td><td>+2.1%<\/td><td>+19.1%<\/td><td>#388<\/td><\/tr><tr><td>PHA (Phala)<\/td><td>$0.0721<\/td><td>−15.5%<\/td><td>+104.4%<\/td><td>#426<\/td><\/tr><tr><td>NIL (Nillion)<\/td><td>$0.0965<\/td><td>−15.9%<\/td><td>+97.9%<\/td><td>#503<\/td><\/tr><tr><td>ARX (Arcium)<\/td><td>$0.2249<\/td><td>−8.3%<\/td><td>+22.7%<\/td><td>#518<\/td><\/tr><tr><td>SCRT (Secret)<\/td><td>$0.00833<\/td><td>−0.5%<\/td><td>+3.1%<\/td><td>#1682<\/td><\/tr><\/tbody><\/table><\/div><p><b>Top-250 24h gainers (excluding stablecoins):<\/b> QNT +90.6% (7d +170%), Q (Quack AI) +36%, RUNE +20%, 2Z +18%, BTW +16%, DASH +13.5%, GRASS +12.9%, RAIN +12.9%, PYTH +12.4%. <b>Top 7d:<\/b> QNT +170%, BP (Backpack) +104%, BTW +74%, KMNO +68%, GRASS +62%, RUNE +51%, SEI +50%, NEAR +45%, SUI +43%.<\/p><p><b>CoinGecko trending:<\/b> QNT, EDEL, ZEC, PENGU, ENA, NEAR, PONS, TAO, SUI, RAY, XRP, BP, KAS, RHEA, BTC. Trending categories include &quot;Privacy Infrastructure&quot; and &quot;Chain Abstraction&quot;.<\/p><p><b>Macro backdrop:<\/b> the Fed hiked 25bp to 3.75–4.00% on Sep 16. The US 10Y yield hit 5.23% on Thu Sep 24, a 19-year high, and closed Friday at 5.17%. Markets price ~70% odds of another hike on Oct 28 (<a href=\"https://nordfx.com/market-news/forex-cryptocurrency-forecast-september-28-october-02-2026\" target=\"_blank\" rel=\"noopener\">NordFX weekly, Sep 26<\/a>; <a href=\"https://blog.e8markets.com/article/higher-fed-hike-odds-put-fresh-macro-pressure-on-bitcoin\" target=\"_blank\" rel=\"noopener\">E8 Markets, Sep 26<\/a>).<\/p>"},{"h":"(b) Items that clear the bar","body":"<ul><li><b>Spot BTC ETFs took in +$2.39B for Sep 21–25, and 2026 net flows turned positive.<\/b> This was the best week since Oct 2025. Daily inflows faded from $999M on Monday to $134M on Friday after hot PMI data and 5%+ yields. ETH ETFs added ~$690M, and SOL ETFs set a record daily inflow of $86.7M on Friday.<\/li><\/ul><p>   <i>Why it matters:<\/i> this is direct institutional demand for his BTC. The fading daily pace is the caveat. <i>Substantive<\/i> (fund-flow data). <a href=\"https://www.theblock.co/news/markets/2026-09-26-bitcoin-etfs-turn-positive-for-2026-with-2-4-billion-weekly-inflow-their-largest-since-october-416944\" target=\"_blank\" rel=\"noopener\">The Block, Sep 26<\/a> · <a href=\"https://u.today/bitcoin-etfs-record-239-billion-weekly-inflows-as-btc-holds-above-84000\" target=\"_blank\" rel=\"noopener\">U.Today, Sep 26<\/a> · <a href=\"https://247wallst.com/investing/cryptocurrency/2026/09/26/bitcoin-etf-inflows-reach-2-4-billion-this-week-but-daily-figures-decline-is-the-momentum-fading/\" target=\"_blank\" rel=\"noopener\">24/7 Wall St, Sep 26<\/a><\/p><ul><li><b>Bitwise NEAR ETF (ticker NRR): the SEC declared its registration effective on Sep 24, and Bitwise filed Form 8-A for NYSE Arca.<\/b> The fund plans to stake its NEAR holdings and charge a 0.75% fee. <b>No first trading date is set.<\/b> NEAR is +44.7% over 7 days.<\/li><\/ul><p>   <i>Why it matters:<\/i> a US spot ETF is close for a watchlist coin. <i>Substantive<\/i> (a regulatory milestone), but the price already reflects anticipation. <a href=\"https://finance.biggo.com/news/7af62fa4-92e2-45ca-9c8e-f442791b3569\" target=\"_blank\" rel=\"noopener\">BigGo, Sep 26<\/a> · <a href=\"https://www.coingabbar.com/en/bitwise-near-etf-nrr-nyse-arca-news-near-token-price-rally\" target=\"_blank\" rel=\"noopener\">CoinGabbar, Sep 26<\/a><\/p><ul><li><b>Zcash hit a record high of $1,697.45 on Sat Sep 26. Grayscale&#x27;s ZCSH ETF crossed $1B AUM on Sep 24 and has a 3-for-1 split pending. The NU7 upgrade is dated.<\/b><\/li><li>ZCSH: cumulative net inflows are only ~$306M, so most of the AUM growth is price. Split record date is Sep 28, effective before the Sep 30 open.<\/li><li>NU7: code complete Sep 30, testnet Oct 6, mainnet decision Oct 20, mainnet Nov 5. It brings 25-second blocks and keeps halvings.<\/li><li>Usage: ~63k shielded transactions in the week, the busiest since 2022.<\/li><\/ul><p>   <i>Why it matters:<\/i> this is the core coin of his privacy theme, with real on-chain usage and ETF demand. <i>Substantive<\/i>, but the move is parabolic. The long-run overhang is the EU AMLR ban on exchange-listed anonymity coins from Jul 10, 2027. <a href=\"https://www.tokenpost.com/news/investing/24492\" target=\"_blank\" rel=\"noopener\">TokenPost, Sep 26<\/a> · <a href=\"https://www.analyticsinsight.net/news/grayscales-zcash-etf-reaches-usd-1b-as-zec-price-gains-lift-assets\" target=\"_blank\" rel=\"noopener\">Analytics Insight<\/a> · <a href=\"https://forum.zcashcommunity.com/t/nu7-timeline/57655\" target=\"_blank\" rel=\"noopener\">Zcash Forum NU7 timeline, Sep 17<\/a> · <a href=\"https://www.coindesk.com/tech/2026/09/25/bitcoin-could-soon-get-zcash-style-shielded-privacy-without-changing-its-rules\" target=\"_blank\" rel=\"noopener\">CoinDesk, Sep 25<\/a><\/p><ul><li><b>XRP is +10.6% over 7 days (−3.1% over 24h), with ETF inflows still running.<\/b><\/li><li>ETFs: +$22.65M on Sep 25 (led by Bitwise and Franklin), ~$1.79B cumulative.<\/li><li>Upgrade delay: the XRPL Batch amendment slipped from Sep 29 to <b>Oct 9 at the earliest<\/b> (10:46 AM ET) after validator support briefly dropped below 80%. PermissionDelegation is now earliest Oct 8.<\/li><li>Caveat: the Sep 18 +7.7% jump came from a routine post-effective amendment to the already-trading Bitwise XRP ETF, not a new approval.<\/li><\/ul><p>   <i>Why it matters:<\/i> this is his largest holding. <i>Substantive<\/i> but incremental, and the ledger features are only delayed. <a href=\"https://bitinsider.io/articles/xrp-spot-etf-inflows-climb-to-2265-million-as-price-falls-46\" target=\"_blank\" rel=\"noopener\">BitInsider, Sep 26<\/a> · <a href=\"https://www.coindesk.com/tech/2026/09/26/xrp-ledger-s-batch-upgrade-slips-to-oct-9-after-validator-support-resets\" target=\"_blank\" rel=\"noopener\">CoinDesk, Sep 26<\/a> · <a href=\"https://finance.biggo.com/news/7af62fa4-92e2-45ca-9c8e-f442791b3569\" target=\"_blank\" rel=\"noopener\">BigGo, Sep 26<\/a><\/p><ul><li><b>Quant (QNT) is +90.6% over 24h after The Clearing House picked it for its On-Chain Money Initiative.<\/b> QNT will provide the orchestration layer for tokenized deposits over the RTP and CHIPS networks, with rollout targeted for H1 2027. A UK tokenized-sterling pilot (Barclays, HSBC, Lloyds and others) was also reported live.<\/li><\/ul><p>   <i>Why it matters:<\/i> this is a real deal with US bank infrastructure. <i>The partnership is substantive; the size of the move is partly a short squeeze.<\/i> QNT is not on his watchlist. <a href=\"https://www.theclearinghouse.org/payment-systems/Articles/2026/09/The-Clearing-House-Partners-with-Quant-to-Advance-the--On-Chain-Money-Initiative\" target=\"_blank\" rel=\"noopener\">The Clearing House press release, Sep 24<\/a> · <a href=\"https://azat.tv/en/quant-qnt-banking-tokenisation-rally-september-2026/\" target=\"_blank\" rel=\"noopener\">Azat TV, Sep 27<\/a><\/p><ul><li><b>Open USD (OUSD) stablecoin consortium update (Sep 25).<\/b> Coinbase, Mastercard, Shopify, Stripe and Visa will seed more than $1B in initial liquidity, and Zach Abrams becomes full-time CEO. The consortium has 140+ partners, including Google, BlackRock, BNY and Ripple, and launch is planned for later in 2026.<\/li><\/ul><p>   <i>Why it matters:<\/i> big tech, payments and banks are converging on stablecoin rails, but there is no investable token. <i>Substantive.<\/i> The Sep 25 details come from secondary coverage; the original announcement was Jun 30. <a href=\"https://phemex.com/news/article/open-standard-secures-1b-liquidity-from-coinbase-visa-stripe-for-ousd-stablecoin-launch-97813\" target=\"_blank\" rel=\"noopener\">Phemex<\/a> · <a href=\"https://coingape.com/block-of-fame/pulse/open-standard-ousd-gets-full-time-ceo-as-bridge-co-founder-zach-leaves-stripe/\" target=\"_blank\" rel=\"noopener\">Coingape<\/a> · <a href=\"https://joinopenstandard.com/blog/introducing-open-usd/\" target=\"_blank\" rel=\"noopener\">Open Standard, Jun 30<\/a><\/p><ul><li><b>Privacy x AI / confidential compute: the integrations are real, but the price moves are heavily leveraged.<\/b><\/li><li>Moves: PHA +104% over 7d but −15.5% over 24h; NIL +98% / −15.9%; ARX +23% / −8%; ROSE +19%; ZAMA +13%.<\/li><li>Integrations: NEAR AI&#x27;s confidential inference went live on Bittensor&#x27;s SayGm gateway (Sep 18). Venice runs encrypted inference on NEAR.<\/li><li>Leverage: PHA futures open interest (~$120M) exceeded its entire spot market cap during the spike.<\/li><\/ul><p>   <i>Why it matters:<\/i> this is exactly his theme, and it moved 10%+. <i>Speculative price action on top of integrations that are substantive but small.<\/i> <a href=\"https://taodaily.io/near-ai-joins-forces-with-bittensors-saygm-to-make-private-ai-easier-to-use/\" target=\"_blank\" rel=\"noopener\">TAO Daily, Sep 20<\/a> · <a href=\"https://www.cryptonewslive.org/article/pha-tripled-with-three-privacy-tokens-then-leverage-erased-a-third-of-it\" target=\"_blank\" rel=\"noopener\">CryptoNewsLive on PHA leverage, Sep 22<\/a> · <a href=\"https://www.tradingview.com/news/coinmarketcal:b6261e451094b:0-near-protocol-venice-launches-verifiably-encrypted-ai-inference-on-near-24-sep-2026/\" target=\"_blank\" rel=\"noopener\">TradingView/CoinMarketCal, Venice on NEAR, Sep 24<\/a><\/p><ul><li><b>Venice (VVV) is +14.4% over 7d (−3.2% over 24h), about 15% below its Sep 21 all-time high of $34.51.<\/b> Emissions drop from 2.5M to 2M VVV per year on <b>Oct 1<\/b>.<\/li><li>Fundamentals (self-reported): $100M annualized revenue run rate in August; $65M Series A at a $1B valuation (Dragonfly).<\/li><li>Risk: the top 100 wallets hold ~98% of supply.<\/li><\/ul><p>   <i>Substantive business, concentrated token.<\/i> <a href=\"https://decrypt.co/378840/what-is-vvv-privacy-ai-token-up-3000-percent-2026\" target=\"_blank\" rel=\"noopener\">Decrypt, Sep 21<\/a> · <a href=\"https://venice.ai/blog/tokenomics-update-credit-burns-and-diem-supply-expansion\" target=\"_blank\" rel=\"noopener\">Venice blog<\/a><\/p><ul><li><b>US regulation: the CLARITY Act failed its Senate vote (Sep 15), so the agencies are acting without Congress.<\/b><\/li><li>SEC: &quot;Innovation Exemption&quot; order on Sep 17 (5 years of relief for tokenized-stock trading venues); a crypto custody proposal sent to OMB.<\/li><li>CFTC: Chair Selig said &quot;It&#x27;s go time&quot; on Sep 24; two crypto prerules filed at OMB.<\/li><\/ul><p>   <i>Why it matters:<\/i> rules are arriving faster, but agency rules can be reversed by a future administration, unlike a statute. <i>Substantive.<\/i> <a href=\"https://thehill.com/policy/technology/6096345-trump-regulators-crypto-rules/\" target=\"_blank\" rel=\"noopener\">The Hill, Sep 17<\/a> · <a href=\"https://cryptogazette.com/cftc-selig-go-time-crypto-rules-perps/\" target=\"_blank\" rel=\"noopener\">CryptoGazette, Sep 24<\/a> · <a href=\"https://www.jonesday.com/en/insights/2026/09/the-secs-new-innovation-exemption-fiveyear-relief-for-trading-on-tokenized-securities-venues\" target=\"_blank\" rel=\"noopener\">Jones Day, Sep 2026<\/a><\/p>"},{"h":"(c) Filtered out","body":"<ul><li><b>Ripple/Securitize RLUSD–BlackRock BUIDL &quot;announcement&quot;<\/b>: recycled news from Sep 23, 2025.<\/li><li><b>Brave Wallet × NEAR Intents, d","features":{"blackrock":{"kicker":"Institutional read · Sep 22–23, 2026","title":"BlackRock: “The Machine-Native Economy”","lede":"BlackRock Digital Assets Research (Su, Mitchnick, Jacobs, Helm) argues AI agents are an “underappreciated” source of demand for digital assets. Verified against the 11-page PDF.","points":["Agents need machine-native payment rails: card/ACH onboarding, fees and settlement don’t fit always-on, sub-cent machine payments. Names x402, MPP, ACP, AP2 and Visa TAP.","Stablecoins “are likely to lead transactional use”: >$300B circulating (Sep 2026) and >$11T adjusted volume in 2025, in Visa/Mastercard’s range (still far below ACH’s $93T).","Native assets like ETH could benefit as stablecoin activity drives demand for blockspace and fees, depending on each chain’s fee design. It also names Circle’s Arc.","Tokenized compute capacity as a new asset class: ~$1.1T hyperscaler cloud revenue by 2030; expects standardized compute contracts and futures settled on-chain.","Cites Stripe’s Aug 2026 deal to acquire OpenRouter (400+ models) as a sign compute buying is merging with billing and settlement."],"favors":["Stablecoins (USDC)","Smart-contract chains (ETH, Arc)","Compute markets"],"absent":["XRP / Ripple / RLUSD","Privacy coins (ZEC, XMR)","Privacy / confidential AI","AI or GPU tokens"],"caveat":"BlackRock itself says agent payments and compute-market liquidity are “still limited”. TRM Labs estimates genuine agents made only 0.6–7.5% of 2026 x402 value. It’s a thesis, not a forecast.","sources":[{"t":"BlackRock: The Machine-Native Economy (PDF)","u":"https://www.blackrock.com/us/individual/literature/whitepaper/the-machine-native-economy.pdf"},{"t":"Cointelegraph (Sep 23)","u":"https://cointelegraph.com/news/ai-potential-to-drive-crypto-demand-remains-underappreciated-blackrock"},{"t":"Decrypt (Sep 23)","u":"https://decrypt.co/379070/blackrock-ai-agents-crypto-next-demand-wave"},{"t":"Stripe: agrees to acquire OpenRouter (Aug 19)","u":"https://stripe.com/newsroom/news/stripe-agrees-to-acquire-openrouter"}]},"myth":{"kicker":"Myth check · BTC ETF timing study","title":"“ETFs buy BTC at 3–4 PM, so trade the window”","verdict":"Myth for retail","rows":[{"k":"3–4 PM window","v":"−2.1 bps/day","s":"post-ETF, n=673, t=−0.94: no edge","c":"dn"},{"k":"4–6 PM drift","v":"+10.9 bps/day","s":"t=4.18, real-looking but below retail costs (break-even ~11 bps round trip)","c":"amber"},{"k":"4 PM → next open","v":"+42 → −3 bps","s":"worked in 2024; gone since in-kind creations began (Aug 2025)","c":"dim"}],"note":"IBIT’s NAV is set from 3–4 PM trades, but orders are known a day ahead, matched to the benchmark, and ~78% of creations are now in-kind. Retail fees (~0.4–0.9% per side, reported) swamp every effect. Source: etf-timing/findings.md (Coinbase BTC-USD Jan 2023–Sep 26 2026; Farside flows).","image":"app/assets/etf-timing-opt.png","image_alt":"Four-panel chart: BTC returns by hour, by year, rolling 90-day averages and backtests for ETF timing windows"}},"ideas":{"rules":{"notional_usd":1000,"fee_per_side":0.003,"fee_round_trip":0.006,"spot_long_only":true,"leverage":false,"min_reward_risk":2.0,"min_stop_atr":1.0,"chase_limit_30d":0.6,"both_touched_same_bar":"stop first","paper_only":true,"the_bar":["Spot only, long only, no leverage. Nothing Casey couldn't buy outright on an exchange. Exception: the market-neutral funding-carry family (long spot + equal short perp, 1x collateral, paper only).","Don't chase: no asset already up big on leverage or hype (hard gate: >60% in 30 days is rejected; futures-driven spikes are rejected even below that).","Reward:risk of at least 2:1, with the stop set from real volatility (>= 1x ATR14, normally 1.5-2x ATR14) or a real level beyond that.","Base-rate reasoning with data: how often this kind of setup worked historically (n, win rate, avg net after 0.6% fees), compared with a no-setup baseline. Breakeven win rate at 2:1 is 33%.","Write the strongest argument against it, and what has  s+='<path d="'+d+'L'+W+','+H+'L0,'+H+'Z" fill="url(#cg)"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
 s+='<circle cx="'+X(imx)+'" cy="'+Y(mx)+'" r="3.5" fill="'+col+'"/><circle cx="'+X(imn)+'" cy="'+Y(mn)+'" r="3.5" fill="#94a3b8"/>';

 return stl+s;}
function bindChart(pts){var svg=$('#chsvg');if(!svg)return;var W=600,H=220,P=6,ys=pts.map(function(p){return p[1];}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys),rg=mx-mn||1;
 var lx=$('#chx'),dt=$('#chd'),rd=$('#cread'),def=rd.innerHTML;
 function mv(e){var r=svg.getBoundingClientRect();var cx=(e.touches?e.touches[0].clientX:e.clientX);var i=Math.round((cx-r.left)/r.width*(pts.length-1));i=Math.max(0,Math.min(pts.length-1,i));
  var x=i/(pts.length-1)*W,y=P+(1-(pts[i][1]-mn)/rg)*(H-2*P);lx.setAttribute('x1',x);lx.setAttribute('x2',x);lx.setAttribute('opacity',.6);dt.setAttribute('cx',x);dt.setAttribute('cy',y);dt.setAttribute('opacity',1);
  var d=new Date(pts[i][0]*1000);rd.innerHTML='<b style="color:#fff">'+fp(pts[i][1])+'</b> · '+MON[d.getMonth()]+' '+d.getDate()+', '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})+' ET';}
 function out(){lx.setAttribute('opacity',0);dt.setAttribute('opacity',0);rd.innerHTML=def;}
 svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);svg.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')out();});svg.addEventListener('touchmove',mv,{passive:true});}
var lastFocus=null;

 $('#sht').innerHTML='<div style="min-width:0"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="sym" style="font-size:16px'+(c.holding?';color:#fcd34d':'')+'">'+esc(c.sym)+'</span><span class="nm" style="font-size:14px">'+esc(c.name)+'</span>'+badges(c)+'</div><div style="font-size:11.5px;color:var(--dim);margin-top:3px">'+esc(laneName(c.lane))+(m.rank?' · rank #'+m.rank:'')+'</div></div><button class="x" id="xbtn" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';

 h+='<div class="rate">'+dots(c.rating.score)+'<div><div class="rl">'+esc(c.rating.label)+'</div><div class="rs">Substantive-vs-hype rating: '+c.rating.score+'/5 (5 = most substantive)</div></div></div>';
 h+='<div class="sec"><h4>What it is</h4><p>'+esc(c.what)+'</p></div><div class="sec"><h4>AI angle</h4><p>'+esc(c.ai)+'</p></div>';
 h+='<div class="bb"><div class="card bull"><h4 style="font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px">Bull case</h4><p>'+esc(c.bull)+'</p></div><div class="card bear"><h4 style="font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px">Bear case / risks</h4><p>'+esc(c.bear)+'</p></div></div>';
 h+='<div class="sec"><h4>Sources</h4><div class="srcs">'+c.sources.map(function(s){return '<a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>';}).join('')+'</div></div>';
 h+='<p class="note" style="margin-top:14px">Price data: CoinGecko, '+esc(D.pulled)+'. Not financial advice.</p>';
 $('#sb').innerHTML=h;$('#sb').scrollTop=0;
 $('#ov').classList.add('on');$('#sheet').classList.add('on');document.body.classList.add('lock');
 $('#xbtn').onclick=closeSheet;if(c.chart)bindChart(c.chart);setTimeout(function(){$('#xbtn').focus({preventScroll:true});},50);
 if(location.hash.indexOf('coin=')<0)history.pushState({coin:id},'','#'+cur+'/coin='+id);}

 if(!fromPop&&location.hash.indexOf('coin=')>=0)history.back();if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});}

document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('.node')){e.preventDefault();openCoin(e.target.closest('.node').dataset.coin);}});

 sh.addEventListener('touchend',function(){if(y0==null)return;sheet.style.transition='';sheet.style.transform='';if(dy>90)closeSheet();y0=null;});})();
